function logEvent(type,data={}){
  if(!gameState)return;
  gameState.log.push({
    at:new Date().toISOString(),
    type,
    ...data
  });
  if(DEBUG)console.log(type,data);
}

function exportLog(){
  if(!gameState)return;
  const payload={
    version:gameState.version,
    startedAt:gameState.startedAt,
    round:gameState.round,
    result:gameState.result,
    log:gameState.log
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`mahjong_log_${new Date().toISOString().replace(/[:.]/g,'-')}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function tileColorClass(type){
  if(type.endsWith('m')) return 'tile-suit-man';
  if(type.endsWith('p')) return 'tile-suit-pin';
  if(type.endsWith('s')) return 'tile-suit-sou';
  if(type==='C') return 'tile-red';
  if(type==='F') return 'tile-green';
  return 'tile-honor';
}

function render(){
  if(!gameState)return;
  if(DEBUG){
    const counts = gameState.players.map(p=>p.hand.length);
    console.log('hand counts', counts, 'currentPlayer', gameState.currentPlayer, 'processing', processing);
  }
  document.getElementById('round').textContent=
    `${gameState.round}${gameState.honba?` ${gameState.honba}本場`:''}`;
  el.wallCount.textContent=`残り ${gameState.wall.length}牌 / 供託 ${gameState.riichiPot}点`;
  if(gameState.doraIndicator){
    const ds=(gameState.doraIndicators||[gameState.doraIndicator]).filter(Boolean);
    // v026 hotfix: カンドラは内部計算だけでなく、表示牌もすべて横並びで見せる。
    setTileFace(el.doraTile,ds[0].type);
    el.doraTile.className=tileColorClass(ds[0].type);
    el.doraTile.title=`ドラ表示牌 ${ds[0].type} → ドラ ${nextDoraType(ds[0].type)}`;
    el.doraLine.querySelectorAll('.dora-extra').forEach(x=>x.remove());
    for(const ind of ds.slice(1)){
      const sp=document.createElement('span');
      sp.className=`dora-extra ${tileColorClass(ind.type)}`;
      sp.title=`カンドラ表示牌 ${ind.type} → ドラ ${nextDoraType(ind.type)}`;
      sp.style.marginLeft='3px';
      setTileFace(sp,ind.type);
      el.doraLine.appendChild(sp);
    }
  }

  const human=gameState.players[0];
  if(gameState.currentPlayer===0 && human.hand.length===expectedReadyToDiscardCount(0) && !gameState.gameOver && !pendingRon && !pendingCall){
    const a=analyzePlayerDiscardChoices(0);
    if(a.length){
      const b=a[0];
      el.analysisLine.innerHTML=`おすすめ <span class="recommend-tile ${tileColorClass(b.type)}" title="おすすめ牌 ${b.type}"></span>`;
      setTileFace(el.analysisLine.querySelector('.recommend-tile'),b.type);
    }
  }else if(human.hand.length===expectedAfterDiscardCount(0)){
    el.analysisLine.textContent='';
  }else{
    el.analysisLine.textContent='';
  }
  el.status.textContent=`${gameState.round} / Turn ${gameState.turn} / ${PLAYER_NAMES[gameState.currentPlayer]}`;
  const playerHandLen = gameState.players[0].hand.length;
  el.handCount.textContent = `手牌 ${playerHandLen}枚`;
  el.turnText.textContent=gameState.currentPlayer===0 && !processing ? 'あなたの手番' : '';
  el.tsumoBtn.classList.toggle('show',
    playerCanTsumo && !gameState.gameOver && gameState.currentPlayer===0 && !processing && !pendingRon
  );
  el.ronBtn.classList.toggle('show', !!pendingRon && !gameState.gameOver);
  const callOpt=pendingCall ? pendingCall.options : null;
  el.chiBtn.classList.toggle('show', !!callOpt && callOpt.chi.length>0 && !gameState.gameOver);
  el.ponBtn.classList.toggle('show', !!callOpt && callOpt.pon && !gameState.gameOver);
  const ankan=(!pendingCall && gameState.currentPlayer===0 && !processing && !gameState.gameOver) ? concealedKanOptions(0) : [];
  const kakan=(!pendingCall && gameState.currentPlayer===0 && !processing && !gameState.gameOver) ? addedKanOptions(0) : [];
  el.kanBtn.classList.toggle('show', (!!callOpt && callOpt.kan) || ankan.length>0 || kakan.length>0);
  el.kanBtn.dataset.ankan=ankan[0]||'';
  el.kanBtn.dataset.kakan=kakan.length?JSON.stringify(kakan[0]):'';
  el.kyushuBtn.classList.toggle('show', !pendingCall && gameState.currentPlayer===0 && !processing && !gameState.gameOver && canDeclareKyushu(0));
  el.skipBtn.classList.toggle('show', (!!pendingRon || !!pendingCall) && !gameState.gameOver);

  const canRiichi = !gameState.gameOver && !pendingRon &&
    gameState.currentPlayer===0 && !processing &&
    gameState.players[0].hand.length===expectedReadyToDiscardCount(0) &&
    !gameState.players[0].riichi && !isOpenHand(0) &&
    gameState.players[0].score>=1000 &&
    getRiichiDiscardTypes(gameState.players[0].hand).length>0;
  el.riichiBtn.classList.toggle('show',canRiichi || riichiPending);
  el.riichiBtn.textContent=riichiPending?'リーチ取消':'リーチ';

  document.querySelectorAll('.seat').forEach(seat=>{
    const pid=Number(seat.dataset.player);
    const p=gameState.players[pid];
    seat.classList.toggle('active',pid===gameState.currentPlayer && !gameState.gameOver);
    const score=seat.querySelector('.score');
    if(score)score.textContent=p.score;
    const title=seat.querySelector('.seat-title > span:first-child');
    if(title){
      const old=title.querySelector('.riichi-label');
      if(old)old.remove();
      if(p.riichi){
        const r=document.createElement('span');
        r.className='riichi-label';
        r.textContent='立直';
        title.appendChild(r);
      }
    }

    const backs=seat.querySelector('.back-row');
    if(backs){
      backs.innerHTML='';
      for(let i=0;i<p.hand.length;i++){
        const b=document.createElement('span');
        b.className='back';
        backs.appendChild(b);
      }
    }

    const meldTarget = pid===0 ? el.playerMelds : (()=>{
      let row=seat.querySelector('.meld-row');
      if(!row){
        row=document.createElement('div'); row.className='meld-row';
        const river0=seat.querySelector('.river');
        if(river0)seat.insertBefore(row,river0);
      }
      return row;
    })();
    if(meldTarget){
      meldTarget.innerHTML='';
      for(const m of p.melds){
        const set=document.createElement('span'); set.className='meld-set'; set.title=m.kind;
        for(const type of m.tiles){
          const t=document.createElement('span'); t.className='mini-tile '+tileColorClass(type); setTileFace(t,type); set.appendChild(t);
        }
        meldTarget.appendChild(set);
      }
      meldTarget.classList.toggle('show',p.melds.length>0);
    }

    const river=seat.querySelector('.river');
    if(river){
      river.innerHTML='';
      p.discards.forEach(tile=>{
        const t=document.createElement('span');
        t.className='mini-tile ' + tileColorClass(tile.type) + (tile.riichiDiscard?' riichi-discard':'');
        setTileFace(t,tile.type);
        t.title=tile.type;
        river.appendChild(t);
      });
    }
  });

  renderHand();
}

function renderHand(){
  if(!gameState)return;
  const hand=gameState.players[0].hand;
  el.hand.innerHTML='';
  hand.forEach((tile,index)=>{
    const btn=document.createElement('button');
    btn.className='tile ' + tileColorClass(tile.type)
      + (tile.id===playerDrawnTileId ? ' drawn' : '')
      + (selectedIndex===index ? ' selected' : '');
    setTileFace(btn,tile.type);
    btn.title=tile.type;
    const riichiLegal = !riichiPending || getRiichiDiscardTypes(hand).includes(tile.type);
    btn.disabled=gameState.gameOver || processing || gameState.currentPlayer!==0 || !riichiLegal || !!pendingRon || !!pendingCall;
    btn.addEventListener('click',()=>playerDiscard(index));
    el.hand.appendChild(btn);
  });
}

function renderStandings(){
  if(!el.standings)return;
  const rows=standingsData();
  el.standings.innerHTML='';
  rows.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='standing-row'+(r.pid===0?' me':'');
    d.innerHTML=`<span>${i+1}位 ${r.name}</span><span>${r.score}点</span>`;
    el.standings.appendChild(d);
  });
}

function endGame(kind,winnerId,text,payment=null,ctx=null){
  if(!gameState || gameState.gameOver)return;
  gameState.gameOver=true;
  processing=true;
  playerCanTsumo=false;
  riichiPending=false;
  pendingRon=null;
  pendingCall=null;
  pendingRinshan=null;
  gameState.result={kind,winnerId,text,turn:gameState.turn,payment,ctx};
  logEvent('END',gameState.result);
  render();

  const btn=document.getElementById('againBtn');
  btn.dataset.mode='next';
  btn.textContent='次局へ';
  el.scoreBreakdown.innerHTML='';

  if(kind==='WIN'){
    playSE('win');
    el.resultTitle.textContent=winnerId===0?(ctx&&ctx.winType==='ron'?'ロン！':'ツモ！'):'和了';
    el.resultText.textContent=text;

    if(payment){
      const limit=payment.limit?` ${payment.limit}`:'';
      let detail=`${payment.fu}符 ${payment.han}翻${limit}<br>${payment.yaku.map(x=>x.name).join('・')}`;
      if(ctx && ctx.winType==='ron'){
        detail+=`<br><b>${payment.total}点</b>`;
      }else{
        const parts=Object.entries(payment.payments).map(([pid,a])=>`${PLAYER_NAMES[Number(pid)]} ${a}点`);
        detail+=`<br>${parts.join(' / ')}`;
      }
      if(payment.riichiAward)detail+=`<br>供託 +${payment.riichiAward}点`;
      el.scoreBreakdown.innerHTML=detail;
    }

    // 親が和了した場合は連荘。
    gameState.nextDealerContinues=(winnerId===gameState.dealer);
  }else if(kind==='ABORT'){
    playSE('drawGame');
    el.resultTitle.textContent='途中流局';
    el.resultText.textContent=text;
    el.scoreBreakdown.innerHTML='途中流局のためノーテン罰符なし';
    gameState.nextDealerContinues=true;
  }else if(kind==='ERROR'){
    el.resultTitle.textContent='進行エラー';
    el.resultText.textContent=text;
    btn.textContent='新しい東風戦';
    btn.dataset.mode='newmatch';
  }else{
    playSE('drawGame');
    const draw=applyExhaustiveDrawPayments();
    const tenpaiNames=draw.tenpai.map(pid=>PLAYER_NAMES[pid]);
    const notenNames=draw.noten.map(pid=>PLAYER_NAMES[pid]);

    el.resultTitle.textContent='流局';
    el.resultText.textContent=text;

    let detail=`聴牌：${tenpaiNames.length?tenpaiNames.join('・'):'なし'}<br>`;
    detail+=`ノーテン：${notenNames.length?notenNames.join('・'):'なし'}`;
    if(draw.tenpai.length>0 && draw.tenpai.length<4){
      const moves=draw.delta
        .map((d,pid)=>({pid,d}))
        .filter(x=>x.d!==0)
        .map(x=>`${PLAYER_NAMES[x.pid]} ${x.d>0?'+':''}${x.d}点`);
      detail+=`<br>ノーテン罰符 3000点：${moves.join(' / ')}`;
    }else{
      detail+='<br>全員聴牌または全員ノーテンのため点棒移動なし';
    }
    detail+=`<br>親：${draw.dealerTenpai?'聴牌 → 連荘':'ノーテン → 親流れ'}`;
    el.scoreBreakdown.innerHTML=detail;

    // v016: dealer continues only when dealer is tenpai at exhaustive draw.
    gameState.nextDealerContinues=draw.dealerTenpai;
  }

  renderStandings();
  el.overlay.classList.add('show');
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function isLikelyMobile(){
  return window.matchMedia('(hover: none) and (pointer: coarse)').matches;
}

let rotateHintTimer=null;
function updateRotateHint(){
  const hint=document.getElementById('rotateHint');
  if(!hint)return;
  const portrait=window.matchMedia('(orientation: portrait)').matches;
  const shouldShow=isLikelyMobile() && portrait;
  hint.classList.toggle('show', shouldShow);
  if(rotateHintTimer){ clearTimeout(rotateHintTimer); rotateHintTimer=null; }
  if(shouldShow){
    rotateHintTimer=setTimeout(()=>hint.classList.remove('show'),3000);
  }
}

async function tryLandscapeLock(){
  if(!isLikelyMobile())return false;
  try{
    if(screen.orientation && typeof screen.orientation.lock==='function'){
      // Many browsers only allow orientation lock while fullscreen and after a user gesture.
      if(!document.fullscreenElement && document.documentElement.requestFullscreen){
        try{ await document.documentElement.requestFullscreen({navigationUI:'hide'}); }catch(_){ }
      }
      await screen.orientation.lock('landscape');
      return true;
    }
  }catch(err){
    console.info('Landscape lock unavailable; using rotate hint.',err);
  }
  updateRotateHint();
  return false;
}

window.addEventListener('orientationchange',updateRotateHint);
window.addEventListener('resize',updateRotateHint);

document.getElementById('menuBtn').addEventListener('click',()=>{
  window.location.href='../../index.html';
});

document.getElementById('soundBtn').addEventListener('click',async()=>{
  await toggleSound();
});

document.addEventListener('pointerdown', async ()=>{
  // v015: On mobile, try automatic landscape lock on the first user gesture.
  // If unsupported (notably some Safari/iPhone cases), the rotate hint remains as fallback.
  await tryLandscapeLock();
  if(!soundEnabled){
    await enableAudio();
  }
}, {once:true});

document.getElementById('newBtn').addEventListener('click',()=>{
  el.overlay.classList.remove('show');
  newGame();
});
document.getElementById('againBtn').addEventListener('click',()=>{
  const btn=document.getElementById('againBtn');
  el.overlay.classList.remove('show');
  if(btn.dataset.mode==='newmatch'){
    btn.dataset.mode='next';
    newGame();
    return;
  }
  prepareNextHand(!!gameState.nextDealerContinues);
});
document.getElementById('riichiBtn').addEventListener('click',()=>{
  if(!gameState || gameState.gameOver || processing || pendingRon || pendingCall)return;
  if(gameState.currentPlayer!==0 || gameState.players[0].riichi)return;
  const legal=getRiichiDiscardTypes(gameState.players[0].hand);
  if(!legal.length)return;
  riichiPending=!riichiPending;
  selectedIndex=null;
  setMessage(riichiPending?'リーチ宣言：テンパイになる牌を切ってください':'リーチを取り消しました');
  render();
});

document.getElementById('kyushuBtn').addEventListener('click',()=>{
  if(!gameState || gameState.gameOver || processing || gameState.currentPlayer!==0)return;
  if(!canDeclareKyushu(0))return;
  logEvent('ABORTIVE_DRAW',{reason:'九種九牌',player:0,count:kyushuCount(0)});
  endAbortiveDraw('九種九牌');
});

document.getElementById('tsumoBtn').addEventListener('click',()=>{
  if(!gameState || gameState.gameOver || processing || pendingRon)return;
  if(gameState.currentPlayer!==0 || !playerCanTsumo)return;
  const ctx={winnerId:0,winType:'tsumo',winTileType:playerLastDrawType,rinshan:!!pendingRinshan,haitei:gameState.wall.length===0 && !pendingRinshan};
  const winHand=expandedHandForPlayer(0);
  if(!canWinWithYaku(winHand,ctx))return;
  const pay=applyWinScores(winHand,ctx);
  playerCanTsumo=false;
  endGame('WIN',0,'PLAYER ツモ',pay,ctx);
});

document.getElementById('ronBtn').addEventListener('click',()=>{
  if(!pendingRon || gameState.gameOver)return;
  const pr=pendingRon;
  const ctx={winnerId:0,winType:'ron',discarderId:pr.discarderId,winTileType:pr.tile.type,chankan:!!pr.chankan,houtei:!pr.chankan&&gameState.wall.length===0};
  const pay=applyWinScores(pr.humanHand,ctx);
  pendingRon=null;
  endGame('WIN',0,`PLAYER ロン（${PLAYER_NAMES[pr.discarderId]}から）`,pay,ctx);
});


document.getElementById('chiBtn').addEventListener('click',async()=>{
  if(!pendingCall || gameState.gameOver)return;
  const pc=pendingCall;
  const opts=pc.options.chi;
  if(!opts.length)return;
  // 複数候補時は牌効率が最も良くなる組み合わせを自動選択。
  let best=opts[0], bestS=99;
  for(const need of opts){
    const c=gameState.players[0].hand.slice(); removeTypesFromHand(c,need);
    const m={kind:'CHI',tiles:[pc.tile.type,...need],open:true};
    let s=99;
    for(let i=0;i<c.length;i++){ const c2=c.slice(); c2.splice(i,1); s=Math.min(s,calculateShanten(c2.concat(structuralMeldTiles(m)))); }
    if(s<bestS){bestS=s;best=need;}
  }
  await executeCall(0,pc.discarderId,pc.tile,'CHI',best);
});
document.getElementById('ponBtn').addEventListener('click',async()=>{
  if(!pendingCall || gameState.gameOver || !pendingCall.options.pon)return;
  const pc=pendingCall; await executeCall(0,pc.discarderId,pc.tile,'PON',[pc.tile.type,pc.tile.type]);
});
document.getElementById('kanBtn').addEventListener('click',async()=>{
  if(gameState.gameOver)return;
  if(pendingCall && pendingCall.options.kan){
    const pc=pendingCall; await executeCall(0,pc.discarderId,pc.tile,'KAN',[pc.tile.type,pc.tile.type,pc.tile.type]); return;
  }
  const kb=document.getElementById('kanBtn');
  if(kb.dataset.kakan && !processing && gameState.currentPlayer===0){ await executeAddedKan(0,JSON.parse(kb.dataset.kakan)); return; }
  const type=kb.dataset.ankan;
  if(type && !processing && gameState.currentPlayer===0){ await executeConcealedKan(0,type); }
});

document.getElementById('skipBtn').addEventListener('click',async()=>{
  if(gameState.gameOver)return;
  if(pendingCall){
    const pc=pendingCall; const cpuBest=pc.cpuBest; pendingCall=null;
    if(cpuBest){ await executeCall(cpuBest.x.pid,pc.discarderId,pc.tile,cpuBest.choice.kind,cpuBest.choice.consume); return; }
    gameState.currentPlayer=pc.discarderId; nextPlayer(); processing=false; render(); await beginCurrentTurn(); return;
  }
  if(!pendingRon)return;
  const pr=pendingRon;
  // v018: ロン見送りは次の自摸まで同巡フリテン。リーチ後なら局終了まで解除されない。
  if(gameState.players[0].riichi) gameState.players[0].riichiFuriten=true;
  else gameState.players[0].temporaryFuriten=true;
  logEvent('FURITEN_PASS',{turn:gameState.turn,player:0,riichi:gameState.players[0].riichi,tile:pr.tile.type});
  if(pr.cpuCandidates && pr.cpuCandidates.length){
    const w=pr.cpuCandidates[0];
    const ctx={winnerId:w.pid,winType:'ron',discarderId:pr.discarderId,winTileType:pr.tile.type};
    const pay=applyWinScores(w.hand,ctx);
    pendingRon=null;
    endGame('WIN',w.pid,`${PLAYER_NAMES[w.pid]} ロン（${PLAYER_NAMES[pr.discarderId]}から）`,pay,ctx);
    return;
  }
  await continueAfterRonWindow();
});
document.getElementById('logBtn').addEventListener('click',exportLog);

window.addEventListener('error',e=>{
  console.error('mahjong error',e.error||e.message);
  try{
    const msg=document.getElementById('message');
    if(msg) msg.textContent='起動エラー：' + (e.message || '不明なエラー');
  }catch(_){}
});

function bootMahjong(){
  try{
    updateRotateHint();
    newGame();
  }catch(err){
    console.error('mahjong boot error',err);
    const msg=document.getElementById('message');
    if(msg) msg.textContent='起動エラー：' + (err && err.message ? err.message : String(err));
    const status=document.getElementById('status');
    if(status) status.textContent='v027 起動失敗';
  }
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', bootMahjong, {once:true});
}else{
  bootMahjong();
}
</script>
</body>
