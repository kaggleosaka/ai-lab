<!-- mahjong.html v027 kan-ai-yaku-expansion -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0d5c43" />
<title>Mahjong v027</title>
<style>
  :root{
    --bg:#0d5c43;
    --bg2:#084632;
    --panel:rgba(0,0,0,.18);
    --line:rgba(255,255,255,.18);
    --text:#fff;
    --muted:rgba(255,255,255,.72);
    --tile:#fffdf6;
    --tileText:#111;
    --danger:#ffdddd;
    --accent:#ffd35a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body,#app{touch-action:manipulation}
  html,body{margin:0;width:100%;height:100%;background:var(--bg2);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;overflow:hidden}
  button{font:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  #app{
    width:100vw;
    height:100dvh;
    padding:max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
    display:grid;
    grid-template-rows:auto 1fr auto;
    gap:6px;
    background:radial-gradient(circle at 50% 45%, #137453 0%, var(--bg) 50%, var(--bg2) 100%);
  }
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    min-height:38px;
  }
  .brand{font-weight:800;letter-spacing:.03em;white-space:nowrap}
  .status{font-size:13px;color:var(--muted);text-align:center;flex:1}
  .top-actions{display:flex;gap:6px}
  .small-btn{
    border:1px solid var(--line);
    color:#fff;
    background:rgba(0,0,0,.22);
    border-radius:9px;
    padding:7px 10px;
    font-weight:700;
  }
  #table{
    position:relative;
    min-height:0;
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(0,0,0,.08);
    overflow:hidden;
  }
  .seat{
    position:absolute;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px;
    min-width:90px;
    min-height:70px;
  }
  .seat.top{left:50%;top:6px;transform:translateX(-50%);width:min(46%,320px)}
  .seat.left{left:6px;top:50%;transform:translateY(-50%);width:min(25%,180px)}
  .seat.right{right:6px;top:50%;transform:translateY(-50%);width:min(25%,180px)}
  .seat.bottom{left:50%;bottom:6px;transform:translateX(-50%);width:min(68%,520px)}
  .seat-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:800;
    margin-bottom:4px;
  }
  .turn-badge{
    display:none;
    padding:1px 6px;
    border-radius:999px;
    background:var(--accent);
    color:#362b00;
    font-size:10px;
  }
  .seat.active .turn-badge{display:inline-block}
  .back-row,.river{
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:2px;
  }
  .back{
    width:15px;height:22px;border-radius:3px;
    background:linear-gradient(135deg,#224f8c,#183761);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 1px 1px rgba(0,0,0,.25);
  }
  .river{min-height:25px}
  .mini-tile{
    width:20px;height:27px;
    display:flex;align-items:center;justify-content:center;
    background:var(--tile);color:var(--tileText);
    border-radius:3px;
    font-size:18px;line-height:1;
    border:1px solid #d6d0c0;
    box-shadow:0 1px 1px rgba(0,0,0,.25);
  }
  #center{
    position:absolute;
    left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(44%,300px);
    text-align:center;
    padding:10px;
    background:rgba(0,0,0,.18);
    border:1px solid var(--line);
    border-radius:14px;
  }
  #round{font-weight:900;font-size:22px}
  #wallCount{font-size:13px;color:var(--muted);margin-top:2px}
  #message{
    margin-top:8px;
    min-height:42px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:14px;
  }
  #playerArea{
    min-height:104px;
    display:grid;
    grid-template-rows:auto 1fr;
    gap:4px;
  }
  #handLine{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:6px;
    width:100%;
    min-width:0;
  }
  #playerMelds{
    display:none;
    flex:0 0 auto;
    align-items:flex-end;
    gap:3px;
    padding:3px 4px;
    border:1px solid rgba(255,255,255,.24);
    border-radius:8px;
    background:rgba(0,0,0,.22);
  }
  #playerMelds.show{display:flex}
  #playerMelds::before{
    content:'副露';
    align-self:center;
    margin-right:1px;
    font-size:9px;
    color:var(--muted);
    writing-mode:vertical-rl;
  }
  #playerInfo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    font-size:12px;
  }
  #hand{
    display:flex;
    align-items:end;
    justify-content:center;
    gap:2px;
    width:100%;
    min-width:0;
    overflow:visible;
    padding:5px 2px 3px;
  }
  .tile{
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
    flex:0 0 auto;
    width:min(48px, calc((100vw - 46px) / 14));
    height:min(67px, calc((100vw - 46px) / 14 * 1.42));
    border:1px solid #d8d1be;
    border-bottom-width:4px;
    border-radius:6px;
    background:linear-gradient(#fffef9,#f4efdf);
    color:var(--tileText);
    font-size:clamp(23px,5.4vw,42px);
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 3px rgba(0,0,0,.28);
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    padding:0;
  }
  .tile.drawn{
    margin-left:10px;
    box-shadow:0 0 0 3px rgba(255,211,90,.8), 0 2px 3px rgba(0,0,0,.28);
  }
  .tile.selected{
    transform:translateY(-12px);
    box-shadow:0 7px 7px rgba(0,0,0,.32);
    outline:3px solid var(--accent);
  }
  .tile:disabled{opacity:.62}

  .tile-suit-man{ color:#c62828 !important; }
  .tile-suit-pin{ color:#1565c0 !important; }
  .tile-suit-sou{ color:#2e7d32 !important; }
  .tile-honor{ color:#111 !important; }
  .tile-red{ color:#c62828 !important; }
  .tile-green{ color:#2e7d32 !important; }

  /* v024 visibility tweak: 6-pin gets a custom face so it is easy to distinguish from 8-pin. */
  .pin6-face{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(3,1fr);
    width:.72em;
    height:.92em;
    gap:.06em .08em;
    align-items:center;
    justify-items:center;
    margin:auto;
  }
  /* v025 hotfix: 6-pin uses a rosette/wheel motif like the original circle tiles. */
  .pin6-dot{
    width:.30em;
    height:.30em;
    border-radius:50%;
    color:#1565c0;
    background:
      radial-gradient(circle at center, currentColor 0 13%, transparent 15% 28%, currentColor 30% 39%, transparent 41% 55%, currentColor 57% 64%, transparent 66%),
      repeating-conic-gradient(from 0deg, currentColor 0 8deg, transparent 8deg 22deg);
    -webkit-mask:radial-gradient(circle at center,#000 0 72%,transparent 74%);
            mask:radial-gradient(circle at center,#000 0 72%,transparent 74%);
    filter:drop-shadow(0 0 .012em currentColor);
  }
  .pin6-dot.red{color:#c62828;}
  .mini-tile .pin6-face,#doraTile .pin6-face,.dora-extra .pin6-face,.recommend-tile .pin6-face{
    width:.78em;height:.96em;gap:.045em .07em;
  }
  #actionBar{
    position:fixed;
    left:50%;
    bottom:max(112px, calc(env(safe-area-inset-bottom) + 108px));
    transform:translateX(-50%);
    z-index:15;
    display:flex;
    gap:8px;
    pointer-events:none;
  }
  .action-btn{
    pointer-events:auto;
    border:0;
    border-radius:14px;
    padding:13px 22px;
    font-weight:900;
    font-size:20px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  #tsumoBtn,#ronBtn,#skipBtn,#riichiBtn,#chiBtn,#ponBtn,#kanBtn,#kyushuBtn{
    display:none;
  }
  #tsumoBtn.show,#ronBtn.show,#skipBtn.show,#riichiBtn.show,#chiBtn.show,#ponBtn.show,#kanBtn.show,#kyushuBtn.show{display:block}
  #tsumoBtn{background:#ffd35a;color:#302500}
  #ronBtn{background:#ff6868;color:#2d0000}
  #skipBtn{background:#e8e8e8;color:#222}
  #riichiBtn{background:#7fd8ff;color:#00344b}
  #chiBtn{background:#b9e8ff;color:#00344b}
  #ponBtn{background:#ffd08a;color:#4a2700}
  #kanBtn{background:#d7c3ff;color:#2d125c}
  #kyushuBtn{background:#f6e7a8;color:#3b2b00}
  .meld-row{display:none;gap:2px;min-height:0;margin:2px 0 1px;padding:2px 3px;flex-wrap:wrap;align-items:center;border-top:1px solid rgba(255,211,90,.34);background:rgba(255,211,90,.06);border-radius:5px}
  .meld-row.show{display:flex}
  .meld-row::before{content:'副露';font-size:8px;color:#ffe49a;font-weight:800;margin-right:2px}
  .meld-set{display:inline-flex;gap:1px;padding:1px 2px;border-radius:5px;background:rgba(255,255,255,.10)}
  .meld-set .mini-tile{width:18px;height:24px;font-size:16px}
  #playerMelds .meld-set .mini-tile{width:24px;height:32px;font-size:21px}
  .riichi-discard{
    transform:rotate(90deg);
    margin-left:5px;
    margin-right:5px;
  }
  .riichi-label{
    color:#ffd35a;
    font-weight:900;
    margin-left:4px;
  }
  #doraLine,#analysisLine{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
  }
  #doraTile,.dora-extra,.recommend-tile{
    display:inline-flex;
    width:24px;height:31px;
    align-items:center;justify-content:center;
    background:var(--tile);color:#111;
    border-radius:4px;border:1px solid #d6d0c0;
    font-size:20px;vertical-align:middle;
  }
  #overlay{
    position:fixed;inset:0;
    display:none;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.62);
    z-index:20;
    padding:18px;
  }
  #overlay.show{display:flex}
  .dialog{
    width:min(92vw,480px);
    background:#153f34;
    color:#fff;
    border:1px solid rgba(255,255,255,.25);
    border-radius:18px;
    padding:22px;
    text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .dialog h2{margin:0 0 8px;font-size:28px}
  .dialog p{margin:6px 0 16px;color:var(--muted)}
  #scoreBreakdown{margin:10px 0;font-size:14px;line-height:1.65}
  #standings{margin:12px auto 16px;width:min(100%,340px);text-align:left}
  .standing-row{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.12)}
  .standing-row.me{font-weight:900;color:#ffd35a}
  .primary{
    border:0;border-radius:12px;padding:12px 18px;
    background:var(--accent);color:#302500;font-weight:900;
  }
  /* v015: mobile landscape mode. Desktop layout remains unchanged. */
  #rotateHint{
    position:fixed;left:50%;top:max(48px, env(safe-area-inset-top));
    transform:translateX(-50%);z-index:60;display:none;
    width:min(92vw,520px);pointer-events:none;color:#fff;text-align:center;
  }
  #rotateHint.show{display:block}
  #rotateHint .rotate-card{
    padding:9px 14px;border-radius:12px;
    border:1px solid rgba(255,255,255,.24);background:rgba(21,63,52,.94);
    box-shadow:0 6px 18px rgba(0,0,0,.32);font-weight:800;line-height:1.4;font-size:13px;
  }
  #rotateHint .rotate-icon{font-size:20px;display:inline;margin-right:5px}

  @media (hover:none) and (pointer:coarse) and (orientation:landscape){
    #app{
      padding:3px max(10px, env(safe-area-inset-right)) 3px max(10px, env(safe-area-inset-left));
      gap:3px
    }
    #topbar{min-height:32px}
    .small-btn{padding:5px 8px;font-size:12px}
    #playerArea{min-height:116px;gap:2px}
    #playerInfo{font-size:11px}
    #handLine{gap:4px}
    #hand{gap:3px;padding:3px 2px 2px}
    #playerMelds{gap:2px;padding:2px 3px}
    #playerMelds::before{font-size:8px}
    #playerMelds .meld-set .mini-tile{width:20px;height:27px;font-size:18px}
    .meld-row{padding:1px 2px;margin:1px 0 0}
    .meld-row::before{font-size:7px}
    .meld-row .meld-set .mini-tile{width:15px;height:20px;font-size:14px}
    .tile{
      width:min(58px, calc((100vw - 72px) / 14));
      height:min(82px, calc((100vw - 72px) / 14 * 1.42));
      font-size:clamp(30px,4.7vw,50px);
    }
    .tile.drawn{margin-left:8px}

    /* v015 landscape fix: keep CPU areas away from the center panel. */
    .seat{padding:3px;min-height:48px}
    .seat-title{font-size:10px;margin-bottom:1px}
    .seat.top{
      top:2px;
      width:min(56%,440px);
      min-height:34px;
      display:grid;
      grid-template-columns:auto 1fr;
      align-items:start;
      column-gap:5px;
    }
    .seat.top .seat-title{margin:2px 0 0;white-space:nowrap}
    .seat.top .back-row{display:none}
    .seat.top .river{min-height:22px;align-content:flex-start}
    .seat.left{left:8px;top:54%;width:min(22%,155px);min-height:48px}
    .seat.right{right:3px;top:54%;width:min(22%,155px);min-height:48px}
    .seat.bottom{bottom:2px;width:min(52%,420px);min-height:46px}
    .mini-tile{width:17px;height:22px;font-size:15px}
    .river{min-height:20px;gap:1px}

    /* Fit the complete center information inside the short landscape table. */
    #center{
      top:52%;
      width:min(31%,235px);
      max-height:calc(100% - 88px);
      padding:4px 5px;
      border-radius:10px;
    }
    #round{font-size:16px;line-height:1.05}
    #wallCount{font-size:10px;margin-top:1px;line-height:1.1}
    #analysisLine{font-size:9px;margin-top:1px;line-height:1.15}
    /* v015: on mobile landscape, move dora to the right of the center panel. */
    #doraLine{
      position:absolute;
      left:calc(100% + 12px);
      top:8px;
      width:max-content;
      margin:0;
      padding:3px 6px;
      font-size:10px;
      line-height:1.15;
      border-radius:8px;
      background:rgba(0,0,0,.22);
      border:1px solid var(--line);
      z-index:3;
    }
    #doraTile,.dora-extra,.recommend-tile{width:22px;height:28px;font-size:18px}
    #message{min-height:22px;font-size:10px;line-height:1.15;margin-top:2px}

    /* v015 landscape result dialog: keep the OK/next button easy to reach. */
    #overlay{
      align-items:flex-start;
      padding:6px max(10px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      overflow:auto;
    }
    #overlay .dialog{
      width:min(82vw,520px);
      max-height:calc(100dvh - 12px);
      overflow:auto;
      padding:10px 14px 8px;
      border-radius:14px;
    }
    #overlay .dialog h2{margin:0 0 3px;font-size:21px;line-height:1.05}
    #overlay .dialog p{margin:2px 0 5px;font-size:12px;line-height:1.2}
    #overlay #scoreBreakdown{margin:4px 0;font-size:11px;line-height:1.35}
    #overlay #standings{margin:4px auto 6px;width:min(100%,360px);font-size:11px}
    #overlay .standing-row{padding:2px 6px}
    #overlay .primary{
      /* v015 hotfix: landscape result button is always reachable at upper-right. */
      position:fixed;
      top:max(10px, env(safe-area-inset-top));
      right:max(14px, env(safe-area-inset-right));
      bottom:auto;
      z-index:30;
      padding:11px 24px;
      min-width:150px;
      font-size:16px;
      box-shadow:0 5px 16px rgba(0,0,0,.42);
    }
  }

  @media (orientation:portrait){
    #table{min-height:0}
    .seat.left,.seat.right{width:31%;top:48%}
    .seat.bottom{width:72%}
    #center{width:46%;padding:7px}
    #round{font-size:18px}
    .tile{font-size:clamp(20px,5.4vw,34px)}
    #playerArea{min-height:94px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">麻雀 v027</div>
    <div id="status" class="status">準備中</div>
    <div class="top-actions">
      <button id="menuBtn" class="small-btn" type="button">MENU</button>
      <button id="soundBtn" class="small-btn">🔊 音ON</button>
      <button id="logBtn" class="small-btn">ログ</button>
      <button id="newBtn" class="small-btn">新局</button>
    </div>
  </div>

  <main id="table">
    <section class="seat top" data-player="2">
      <div class="seat-title"><span>CPU2　<span class="score">25000</span></span><span class="turn-badge">手番</span></div>
      <div class="back-row"></div>
      <div class="river"></div>
    </section>

    <section class="seat left" data-player="1">
      <div class="seat-title"><span>CPU1　<span class="score">25000</span></span><span class="turn-badge">手番</span></div>
      <div class="back-row"></div>
      <div class="river"></div>
    </section>

    <section class="seat right" data-player="3">
      <div class="seat-title"><span>CPU3　<span class="score">25000</span></span><span class="turn-badge">手番</span></div>
      <div class="back-row"></div>
      <div class="river"></div>
    </section>

    <section class="seat bottom" data-player="0">
      <div class="seat-title"><span>PLAYER　<span class="score">25000</span></span><span class="turn-badge">手番</span></div>
      <div class="river"></div>
    </section>

    <div id="center">
      <div id="round">東1局</div>
      <div id="wallCount">残り 0牌</div>
      <div id="doraLine">ドラ表示 <span id="doraTile">?</span></div>
      <div id="analysisLine">牌効率を計算中…</div>
      <div id="message">起動中…</div>
    </div>
  </main>

  <section id="playerArea">
    <div id="playerInfo">
      <span>牌を1回タップで選択、もう1回で打牌</span>
      <span><b id="handCount">手牌 14枚</b>　<span id="turnText"></span></span>
    </div>
    <div id="handLine">
      <div id="hand"></div>
      <div id="playerMelds" aria-label="副露牌"></div>
    </div>
  </section>
</div>

<div id="rotateHint" aria-live="polite">
  <div class="rotate-card">
    <span class="rotate-icon">↻</span>スマホは横画面推奨です。横向きにすると牌が大きくなります。
  </div>
</div>

<div id="actionBar">
  <button id="riichiBtn" class="action-btn">リーチ</button>
  <button id="chiBtn" class="action-btn">チー</button>
  <button id="ponBtn" class="action-btn">ポン</button>
  <button id="kanBtn" class="action-btn">カン</button>
  <button id="kyushuBtn" class="action-btn">九種九牌</button>
  <button id="tsumoBtn" class="action-btn">ツモ！</button>
  <button id="ronBtn" class="action-btn">ロン！</button>
  <button id="skipBtn" class="action-btn">見送る</button>
</div>

<div id="overlay">
  <div class="dialog">
    <h2 id="resultTitle">結果</h2>
    <p id="resultText"></p>
    <div id="scoreBreakdown"></div>
    <div id="standings"></div>
    <button id="againBtn" class="primary">次局へ</button>
  </div>
</div>

<script>
'use strict';


// ============================================================
// AudioSystem : Web Audio API / external files not required
// ============================================================
let audioCtx = null;
let masterGain = null;
let bgmGain = null;
let seGain = null;
let soundEnabled = false;
let bgmTimer = null;
let bgmStep = 0;

function initAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;

  audioCtx = new AC();
  masterGain = audioCtx.createGain();
  bgmGain = audioCtx.createGain();
  seGain = audioCtx.createGain();

  masterGain.gain.value = 0.55;
  bgmGain.gain.value = 0.14;
  seGain.gain.value = 0.55;

  bgmGain.connect(masterGain);
  seGain.connect(masterGain);
  masterGain.connect(audioCtx.destination);
}

async function enableAudio(){
  initAudio();
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') await audioCtx.resume();
  soundEnabled = true;
  updateSoundButton();
  startBgm();
}

function disableAudio(){
  soundEnabled = false;
  stopBgm();
  updateSoundButton();
}

function toggleSound(){
  if(soundEnabled) disableAudio();
  else enableAudio();
}

function updateSoundButton(){
  const b = document.getElementById('soundBtn');
  if(!b) return;
  b.textContent = soundEnabled ? '🔊 音ON' : '🔇 音OFF';
}

function tone(freq, duration=0.08, type='sine', gain=0.12, when=0, target='se'){
  if(!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const out = target === 'bgm' ? bgmGain : seGain;
  const t0 = audioCtx.currentTime + when;

  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain), t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

  osc.connect(g);
  g.connect(out);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}

function noiseClick(duration=0.045, gain=0.12){
  if(!soundEnabled || !audioCtx) return;
  const length = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
  const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<length;i++){
    const env = 1 - i/length;
    data[i] = (Math.random()*2-1) * env;
  }
  const src = audioCtx.createBufferSource();
  const g = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1400;
  filter.Q.value = 1.2;
  g.gain.value = gain;
  src.buffer = buffer;
  src.connect(filter);
  filter.connect(g);
  g.connect(seGain);
  src.start();
}

function playSE(name){
  if(!soundEnabled) return;
  switch(name){
    case 'draw':
      tone(740,0.045,'triangle',0.09);
      tone(980,0.055,'triangle',0.07,0.035);
      break;
    case 'discard':
      noiseClick(0.035,0.12);
      tone(1180,0.035,'triangle',0.075,0.000);
      tone(620,0.055,'sine',0.055,0.012);
      break;
    case 'cpuDiscard':
      noiseClick(0.032,0.09);
      tone(980,0.032,'triangle',0.055,0.000);
      tone(520,0.048,'sine',0.040,0.010);
      break;
    case 'select':
      tone(520,0.035,'sine',0.05);
      break;
    case 'win':
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.22,'triangle',0.11,i*0.09));
      break;
    case 'drawGame':
      tone(330,0.18,'sine',0.08);
      tone(277,0.25,'sine',0.07,0.12);
      break;
    case 'start':
      tone(392,0.09,'triangle',0.07);
      tone(523.25,0.12,'triangle',0.07,0.07);
      break;
  }
}

const BGM_MELODY = [
  440.00, null, 523.25, 659.25, 587.33, null, 523.25, 440.00,
  392.00, null, 440.00, 523.25, 440.00, null, 392.00, 329.63,
  293.66, null, 392.00, 440.00, 523.25, null, 440.00, 392.00,
  329.63, null, 293.66, 329.63, 392.00, null, 329.63, 293.66
];
const BGM_BASS = [110.00, 98.00, 87.31, 98.00];
const BGM_CHORDS = [
  [220.00,329.63,440.00],
  [196.00,293.66,392.00],
  [174.61,261.63,349.23],
  [196.00,293.66,392.00]
];

function pluck(freq, when=0, gain=0.035, target='bgm'){
  if(!soundEnabled || !audioCtx || !freq) return;
  tone(freq,0.18,'triangle',gain,when,target);
  tone(freq*2,0.09,'sine',gain*0.22,when+0.006,target);
}

function softPerc(when=0){
  if(!soundEnabled || !audioCtx) return;
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  const t=audioCtx.currentTime+when;
  osc.type='sine';
  osc.frequency.setValueAtTime(95,t);
  osc.frequency.exponentialRampToValueAtTime(55,t+0.09);
  g.gain.setValueAtTime(0.025,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
  osc.connect(g); g.connect(bgmGain);
  osc.start(t); osc.stop(t+0.12);
}

function startBgm(){
  if(!soundEnabled || !audioCtx || bgmTimer) return;
  bgmStep=0;
  const stepMs=330;

  const tick=()=>{
    if(!soundEnabled || !audioCtx) return;
    const step=bgmStep%32;
    const bar=Math.floor(step/8)%4;
    const note=BGM_MELODY[step];

    // 琴を思わせる短い五音音階の旋律
    if(note) pluck(note,0,0.032,'bgm');

    // 4拍ごとの柔らかい低音
    if(step%8===0){
      pluck(BGM_BASS[bar],0,0.045,'bgm');
      softPerc(0);
    }

    // 薄い和音を裏側に置く
    if(step%8===4){
      BGM_CHORDS[bar].forEach((f,i)=>{
        tone(f,0.55,'sine',0.012,i*0.025,'bgm');
      });
    }

    // 小さな合いの手
    if(step%8===6){
      pluck((BGM_CHORDS[bar][1])*2,0,0.018,'bgm');
    }

    bgmStep++;
  };
  tick();
  bgmTimer=setInterval(tick,stepMs);
}

function stopBgm(){
  if(bgmTimer){
    clearInterval(bgmTimer);
    bgmTimer = null;
  }
}

const VERSION = 'v027';
const DEBUG = false;

const TILE_TYPES = [
  '1m','2m','3m','4m','5m','6m','7m','8m','9m',
  '1p','2p','3p','4p','5p','6p','7p','8p','9p',
  '1s','2s','3s','4s','5s','6s','7s','8s','9s',
  'E','S','W','N','P','F','C'
];

const TILE_UNICODE = {
  '1m':'🀇','2m':'🀈','3m':'🀉','4m':'🀊','5m':'🀋','6m':'🀌','7m':'🀍','8m':'🀎','9m':'🀏',
  '1s':'🀐','2s':'🀑','3s':'🀒','4s':'🀓','5s':'🀔','6s':'🀕','7s':'🀖','8s':'🀗','9s':'🀘',
  '1p':'🀙','2p':'🀚','3p':'🀛','4p':'🀜','5p':'🀝','6p':'🀞','7p':'🀟','8p':'🀠','9p':'🀡',
  'E':'🀀','S':'🀁','W':'🀂','N':'🀃','P':'🀆','F':'🀅','C':'🀄'
};

function setTileFace(target,type){
  target.replaceChildren();
  if(type==='6p'){
    const face=document.createElement('span');

const TILE_ORDER = Object.fromEntries(TILE_TYPES.map((t,i)=>[t,i]));
const PLAYER_NAMES = ['PLAYER','CPU1','CPU2','CPU3'];

let gameState = null;
let selectedIndex = null;
let processing = false;
let playerCanTsumo = false;
let playerDrawnTileId = null;
let playerLastDrawType = null;
let riichiPending = false;
let pendingRon = null;
let pendingCall = null;
let pendingRinshan = null;
let pendingChankan = null;

function createWall(){
  const wall = [];
  let id = 0;
  for(const type of TILE_TYPES){
    for(let copy=0; copy<4; copy++) wall.push({id:id++, type});
  }
  shuffle(wall);
  return wall;
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

function sortHand(hand){
  hand.sort((a,b)=>TILE_ORDER[a.type]-TILE_ORDER[b.type] || a.id-b.id);
}

function newGame(){
  SHANTEN_CACHE.clear();
  DISCARD_ANALYSIS_CACHE.clear();
  const wall = createWall();
  const players = PLAYER_NAMES.map((name,i)=>({
    name, hand:[], discards:[], melds:[], score:25000, riichi:false,
    seatWind:['E','S','W','N'][i],

    riichiTurn:null,
    doubleRiichi:false,
    ippatsuEligible:false,
    temporaryFuriten:false,

  }));

  for(let r=0;r<13;r++){
    for(let p=0;p<4;p++) players[p].hand.push(wall.pop());
  }
  players[0].hand.push(wall.pop());
  players.forEach(p=>sortHand(p.hand));

  // v010: 王牌14枚を確保し、ドラ表示牌を1枚使用。
  const deadWall = wall.splice(0,14);
  const doraIndicator = deadWall[4];

  gameState = {
    version: VERSION,
    startedAt: new Date().toISOString(),
    round:'E1',
    roundWind:'E',
    handNumber:1,
    dealer:0,
    honba:0,
    riichiPot:0,
    currentPlayer:0,
    wall,
    deadWall,
    doraIndicator,
    doraIndicators:[doraIndicator],
    callsMade:0,
    players,
    turn:0,
    gameOver:false,
    result:null,
    log:[]
  };
  selectedIndex = null;
  processing = false;
  playerCanTsumo = false;
  playerDrawnTileId = null;
  playerLastDrawType = null;
  riichiPending = false;
  pendingRon = null;
  pendingCall = null;
  pendingRinshan = null;
  pendingChankan = null;

  logEvent('START', {
    version: VERSION,
    round:'E1',
    dealer:0,
    doraIndicator:doraIndicator.type,
    dora:nextDoraType(doraIndicator.type),
    shantenEngine:'v027-special-rounds',
    initialHands: players.map(p=>p.hand.map(t=>t.type))
  });

  playSE('start');

  if(isWinningHand(players[0].hand)){
    playerCanTsumo = true;
    setMessage('和了形です。「ツモ！」を押せます');
  } else {
    setMessage('あなたの手番です。捨てる牌を選んでください');
  }

// ============================================================
// v027 special-round helpers
// ============================================================
function clearIppatsuByCall(){
  for(const p of gameState.players)p.ippatsuEligible=false;
  gameState.callsMade=(gameState.callsMade||0)+1;
}
function isFirstUninterruptedTurn(playerId){
  const p=gameState.players[playerId];
  return (gameState.callsMade||0)===0 && p.discards.length===0;
}
function setRiichiState(playerId){
  const p=gameState.players[playerId];
  p.riichi=true;
  p.riichiStickPaid=true;
  p.riichiTurn=gameState.turn;
  p.doubleRiichi=isFirstUninterruptedTurn(playerId);
  p.ippatsuEligible=true;
}
function totalKanCount(){return gameState.players.reduce((n,p)=>n+p.melds.filter(m=>m.kind==='KAN'||m.kind==='ANKAN'||m.kind==='KAKAN'||(m.tiles||[]).length===4).length,0);}
function shouldAbortFourKans(){
  if(totalKanCount()<4)return false;
  const owners=gameState.players.filter(p=>p.melds.some(m=>m.kind==='KAN'||m.kind==='ANKAN'||m.kind==='KAKAN'||(m.tiles||[]).length===4));
  return owners.length>1;
}
function shouldAbortFourRiichi(){return gameState.players.every(p=>p.riichi);}
function shouldAbortFourWinds(){
  if((gameState.callsMade||0)!==0)return false;
  if(!gameState.players.every(p=>p.discards.length>=1))return false;
  const first=gameState.players.map(p=>p.discards[0].type);
  return ['E','S','W','N'].includes(first[0]) && first.every(t=>t===first[0]);
}
function terminalHonorType(type){const i=TILE_ORDER[type];return i>=27||i%9===0||i%9===8;}
function kyushuCount(playerId){
  const p=gameState.players[playerId];
  if(!isFirstUninterruptedTurn(playerId))return 0;
  return new Set(p.hand.filter(t=>terminalHonorType(t.type)).map(t=>t.type)).size;
}
function canDeclareKyushu(playerId){return kyushuCount(playerId)>=9;}
function endAbortiveDraw(reason){endGame('ABORT',null,reason,null,{abortive:true,reason});}
function checkAbortAfterDiscard(){
  if(shouldAbortFourRiichi()){endAbortiveDraw('四家立直');return true;}
  if(shouldAbortFourWinds()){endAbortiveDraw('四風連打');return true;}
  return false;
}

// ============================================================
// v024 Calls (Chi / Pon / Kan)
// ============================================================
function meldCount(playerId){ return gameState.players[playerId].melds.length; }
function expectedAfterDiscardCount(playerId){ return 13 - 3*meldCount(playerId); }
function expectedReadyToDiscardCount(playerId){ return 14 - 3*meldCount(playerId); }
function isOpenHand(playerId){ return gameState.players[playerId].melds.some(m=>m.open!==false); }

function structuralMeldTiles(m){
  // 和了・向聴計算ではカンも1面子=3枚として扱う。
  return (m.tiles||[]).slice(0,3).map((type,i)=>({id:-50000-i,type}));
}
function expandedHandForPlayer(playerId, concealed=null){
  const p=gameState.players[playerId];
  const out=(concealed||p.hand).map(t=>({id:t.id,type:t.type}));
  for(const m of p.melds) out.push(...structuralMeldTiles(m));
  return out;
}
function removeTypesFromHand(hand, types){
  const removed=[];
  for(const type of types){
    const idx=hand.findIndex(t=>t.type===type);
    if(idx<0) return null;
    removed.push(hand.splice(idx,1)[0]);
  }
  return removed;
}
function countTypeInHand(playerId,type){ return gameState.players[playerId].hand.filter(t=>t.type===type).length; }

function chiOptions(playerId,discarderId,type){
  if(playerId !== (discarderId+1)%4) return [];
  if(gameState.players[playerId].riichi) return [];
  const oi=TILE_ORDER[type];
  if(oi>=27)return [];
  const n=oi%9, suit=type[1];
  const have=t=>countTypeInHand(playerId,t)>0;
  const opts=[];
  for(const starts of [[n-2,n-1],[n-1,n+1],[n+1,n+2]]){
    if(starts.some(x=>x<0||x>8))continue;
    const need=starts.map(x=>`${x+1}${suit}`);
    if(need.every(have)) opts.push(need);
  }
  return opts;
}
function callOptionsFor(playerId,discarderId,tile){
  const p=gameState.players[playerId];
  if(p.riichi)return {chi:[],pon:false,kan:false};
  const same=countTypeInHand(playerId,tile.type);
  return {chi:chiOptions(playerId,discarderId,tile.type),pon:same>=2,kan:same>=3};
}

function analyzePlayerDiscardChoices(playerId){
  const p=gameState.players[playerId], out=[], seen=new Set();
  for(let i=0;i<p.hand.length;i++){
    const type=p.hand[i].type;
    if(seen.has(type))continue;
    seen.add(type);
    const concealed=p.hand.slice(); concealed.splice(i,1);
    const virtual=expandedHandForPlayer(playerId,concealed);
    const shanten=calculateShanten(virtual);
    const u=calculateUkeire(virtual);
    out.push({index:i,type,shanten,ukeire:u.total,ukeireKinds:u.tiles.length,tiles:u.tiles,
      futureUkeire:0,shape:shapeFlexibilityScore(virtual),valueBonus:doraKeepBonus(type)});
  }
  out.sort(compareEnhancedDiscard);
  return out;
}

function shouldCpuCall(playerId,discarderId,tile){
  const opt=callOptionsFor(playerId,discarderId,tile);
  if(!opt.pon && !opt.kan && !opt.chi.length)return null;
  const before=calculateShanten(expandedHandForPlayer(playerId));
  const trials=[];
  if(opt.kan)trials.push({kind:'KAN',consume:[tile.type,tile.type,tile.type],priority:3});
  if(opt.pon)trials.push({kind:'PON',consume:[tile.type,tile.type],priority:2});
  for(const need of opt.chi)trials.push({kind:'CHI',consume:need,priority:1});
  let best=null;
  for(const tr of trials){
    const concealed=gameState.players[playerId].hand.slice();
    if(!removeTypesFromHand(concealed,tr.consume))continue;
    const fakeMeld={kind:tr.kind,tiles:[tile.type,...tr.consume],open:true};
    const virtual=concealed.concat(structuralMeldTiles(fakeMeld));
    // 鳴いた直後は1枚切るので、最善打牌後の向聴で評価。
    let after=99;
    for(let i=0;i<concealed.length;i++){
      const c2=concealed.slice(); c2.splice(i,1);
      after=Math.min(after,calculateShanten(c2.concat(structuralMeldTiles(fakeMeld))));
    }
    if(tr.kind==='KAN') after=Math.min(after,calculateShanten(virtual));
    const cand={...tr,after};
    if(!best || cand.after<best.after || (cand.after===best.after && cand.priority>best.priority))best=cand;
  }
  // v026: 向聴数に加え、鳴いた後の受け入れと役の作りやすさを軽く評価。
  if(!best || best.after>before)return null;
  const p=gameState.players[playerId];
  const valueTypes=new Set(['P','F','C',gameState.roundWind,p.seatWind]);
  const yakuBias=(best.kind==='PON'||best.kind==='KAN') && valueTypes.has(tile.type) ? 2 : 0;
  const concealed=p.hand.slice(); removeTypesFromHand(concealed,best.consume);
  const fm={kind:best.kind,tiles:[tile.type,...best.consume],open:true};
  let bestU=0;
  for(let i=0;i<concealed.length;i++){
    const c2=concealed.slice(); c2.splice(i,1);
    const u=calculateUkeire(c2.concat(structuralMeldTiles(fm))); bestU=Math.max(bestU,u.total);
  }
  best.ukeire=bestU; best.yakuBias=yakuBias;
  if(best.after===before && best.kind==='CHI' && bestU<6)return null;
  if(best.after===before && !yakuBias && bestU<4 && best.kind!=='KAN')return null;
  return best;
}

function drawRinshanTile(playerId){
  if(!gameState.deadWall.length){ endGame('DRAW',null,'王牌がなくなりました'); return null; }
  const tile=gameState.deadWall.pop();
  gameState.players[playerId].hand.push(tile);
  if(playerId===0){ playerDrawnTileId=tile.id; playerLastDrawType=tile.type; }
  else sortHand(gameState.players[playerId].hand);
  pendingRinshan={playerId,type:tile.type,id:tile.id};
  logEvent('RINSHAN_DRAW',{turn:gameState.turn,player:playerId,tile:tile.type});
  playSE('draw');
  return tile;
}

async function executeCall(playerId,discarderId,tile,kind,consume){
  const p=gameState.players[playerId];
  const removed=removeTypesFromHand(p.hand,consume);
  if(!removed)return false;
  const tiles=[tile.type,...consume];
  p.melds.push({kind,tiles,called:tile.type,from:discarderId,open:true});
  clearIppatsuByCall();
  logEvent('CALL',{turn:gameState.turn,player:playerId,from:discarderId,kind,tile:tile.type,tiles});
  pendingCall=null; pendingRon=null; selectedIndex=null; riichiPending=false; playerCanTsumo=false;
  gameState.currentPlayer=playerId;
  processing=true;
  setMessage(`${PLAYER_NAMES[playerId]} が ${kind==='CHI'?'チー':kind==='PON'?'ポン':'カン'}！`);
  if(kind==='KAN'){
    revealKanDora();
    if(shouldAbortFourKans()){endAbortiveDraw('四槓散了');return true;}
    await sleep(120);
    const r=drawRinshanTile(playerId);
    if(!r)return true;
  }
  sortHand(p.hand);
  processing=false;
  render();
  await beginCurrentTurn();
  return true;
}

async function checkCallsAfterDiscard(discarderId,tile){
  const all=[];
  for(let off=1;off<=3;off++){
    const pid=(discarderId+off)%4;
    const opt=callOptionsFor(pid,discarderId,tile);
    if(opt.pon||opt.kan||opt.chi.length)all.push({pid,opt,distance:off});
  }
  if(!all.length)return false;

  const human=all.find(x=>x.pid===0);
  const cpuChoices=all.filter(x=>x.pid!==0).map(x=>({x,choice:shouldCpuCall(x.pid,discarderId,tile)})).filter(x=>x.choice);
  cpuChoices.sort((a,b)=>b.choice.priority-a.choice.priority || a.x.distance-b.x.distance);
  const cpuBest=cpuChoices[0]||null;

  if(human){
    const humanHigh=human.opt.kan||human.opt.pon;
    if(humanHigh || !cpuBest || cpuBest.choice.priority<=1){
      pendingCall={discarderId,tile,options:human.opt,cpuBest};
      processing=false;
      setMessage(`鳴けます：${human.opt.kan?'カン ':''}${human.opt.pon?'ポン ':''}${human.opt.chi.length?'チー':''}`.trim());
      render();
      return true;
    }
  }
  if(cpuBest){
    await executeCall(cpuBest.x.pid,discarderId,tile,cpuBest.choice.kind,cpuBest.choice.consume);
    return true;
  }
  return false;
}


function addedKanOptions(playerId){
  const p=gameState.players[playerId], out=[];
  if(p.riichi)return out;
  for(let mi=0;mi<p.melds.length;mi++){
    const m=p.melds[mi];
    if(m.kind!=='PON')continue;
    const type=m.called||m.tiles[0];
    if(countTypeInHand(playerId,type)>0)out.push({meldIndex:mi,type});
  }
  return out;
}
async function executeAddedKan(playerId,opt){
  const p=gameState.players[playerId], m=p.melds[opt.meldIndex];
  if(!m || m.kind!=='PON')return false;
  const idx=p.hand.findIndex(t=>t.type===opt.type); if(idx<0)return false;
  const tile=p.hand[idx];
  // 槍槓判定: 加槓牌で他家がロンできる場合は槓を成立させない。
  for(let off=1;off<=3;off++){
    const pid=(playerId+off)%4; const base=expandedHandForPlayer(pid);
    const h=base.concat([{id:tile.id,type:tile.type}]);
    const ctx={winnerId:pid,winType:'ron',discarderId:playerId,winTileType:tile.type,baseHand13:base,chankan:true};
    if(canWinWithYaku(h,ctx)){
      if(pid===0){ pendingRon={discarderId:playerId,tile,cpuCandidates:[],humanHand:h,chankan:true}; processing=false; setMessage('槍槓できます！'); render(); return true; }
      const pay=applyWinScores(h,ctx); endGame('WIN',pid,`${PLAYER_NAMES[pid]} 槍槓`,pay,ctx); return true;
    }
  }
  p.hand.splice(idx,1); m.kind='KAKAN'; m.tiles.push(opt.type); m.open=true;
  clearIppatsuByCall();
  revealKanDora();
  logEvent('CALL',{turn:gameState.turn,player:playerId,from:playerId,kind:'KAKAN',tile:opt.type,tiles:m.tiles.slice()});
  if(shouldAbortFourKans()){endAbortiveDraw('四槓散了');return true;}
  processing=true; const r=drawRinshanTile(playerId); if(!r)return true;
  sortHand(p.hand); processing=false; render();
  if(playerId===0)setMessage(`加カン ${opt.type}。嶺上牌を引きました`);
  return true;
}

function drawTile(playerId){
  if(gameState.wall.length===0){
    endGame('DRAW', null, '牌山がなくなりました');
    return null;
  }
  const tile=gameState.wall.pop();
  gameState.players[playerId].temporaryFuriten=false;
  gameState.players[playerId].hand.push(tile);
  playSE('draw');

  // PLAYERはツモ牌をいったん右端に見せてから理牌する。
  if(playerId===0){
    playerDrawnTileId = tile.id;
    playerLastDrawType = tile.type;
  }else{
    sortHand(gameState.players[playerId].hand);
  }

  logEvent('DRAW',{turn:gameState.turn,player:playerId,tile:tile.type});
  return tile;
}

async function arrangePlayerHandAfterDraw(){

function discardTile(playerId, handIndex){

function nextPlayer(){
  gameState.currentPlayer=(gameState.currentPlayer+1)%4;
  gameState.turn++;
}

function countTiles(hand){
  const c=Array(34).fill(0);
  for(const t of hand)c[TILE_ORDER[t.type]]++;
  return c;
}

function isWinningHand(hand){
  if(hand.length!==14) return false;
  const counts=countTiles(hand);
  if(isKokushi(counts)) return true;
  if(isSevenPairs(counts)) return true;

  for(let i=0;i<34;i++){
    if(counts[i]>=2){
      counts[i]-=2;
      if(canFormMelds(counts)){
        counts[i]+=2;
        return true;
      }
      counts[i]+=2;
    }
  }
  return false;
}

function isSevenPairs(c){
  let pairs=0;
  for(const n of c){
    if(n===2)pairs++;
    else if(n!==0)return false;
  }
  return pairs===7;
}

function isKokushi(c){
  const terminals=[0,8,9,17,18,26,27,28,29,30,31,32,33];
  let pair=false;
  for(let i=0;i<34;i++){
    if(terminals.includes(i)){
      if(c[i]===0)return false;
      if(c[i]>=2)pair=true;
    }else if(c[i]!==0)return false;
  }
  return pair;
}

function canFormMelds(c){
  let i=0;
  while(i<34 && c[i]===0)i++;
  if(i===34)return true;

  if(c[i]>=3){
    c[i]-=3;
    if(canFormMelds(c)){c[i]+=3;return true;}
    c[i]+=3;
  }

  const inSuit=i<27;
  const pos=i%9;
  if(inSuit && pos<=6 && c[i+1]>0 && c[i+2]>0){
    c[i]--;c[i+1]--;c[i+2]--;
    if(canFormMelds(c)){c[i]++;c[i+1]++;c[i+2]++;return true;}
    c[i]++;c[i+1]++;c[i+2]++;
  }
  return false;
}


// ============================================================
// Shanten / Ukeire / Yaku / Dora
// ============================================================
const SHANTEN_CACHE=new Map();
function cloneCounts(c){ return c.slice(); }

function standardShantenFromCounts(base){
  let best=8;
  const c=cloneCounts(base);

  function dfs(i,meld,taatsu,pairUsed){
    while(i<34 && c[i]===0)i++;

    if(i>=34){
      const usableTaatsu=Math.min(taatsu,4-meld);
      const s=8-(meld*2)-usableTaatsu-(pairUsed?1:0);
      if(s<best)best=s;
      return;
    }

    // 刻子
    if(c[i]>=3){
      c[i]-=3;
      dfs(i,meld+1,taatsu,pairUsed);
      c[i]+=3;
    }

    // 順子
    if(i<27 && i%9<=6 && c[i+1]>0 && c[i+2]>0){
      c[i]--;c[i+1]--;c[i+2]--;
      dfs(i,meld+1,taatsu,pairUsed);
      c[i]++;c[i+1]++;c[i+2]++;
    }

    // 雀頭は1組だけ。
    if(!pairUsed && c[i]>=2){
      c[i]-=2;
      dfs(i,meld,taatsu,true);
      c[i]+=2;
    }

    // 余った対子は搭子として評価できる。
    if(c[i]>=2){
      c[i]-=2;
      dfs(i,meld,taatsu+1,pairUsed);
      c[i]+=2;
    }

    // 隣接搭子
    if(i<27 && i%9<=7 && c[i+1]>0){
      c[i]--;c[i+1]--;
      dfs(i,meld,taatsu+1,pairUsed);
      c[i]++;c[i+1]++;
    }

    // 嵌張搭子
    if(i<27 && i%9<=6 && c[i+2]>0){
      c[i]--;c[i+2]--;
      dfs(i,meld,taatsu+1,pairUsed);
      c[i]++;c[i+2]++;
    }

    // この牌を孤立牌として処理
    c[i]--;
    dfs(i,meld,taatsu,pairUsed);
    c[i]++;
  }

  dfs(0,0,0,false);
  return best;
}

function chiitoiShanten(c){
  const pairs=c.filter(n=>n>=2).length;
  const unique=c.filter(n=>n>0).length;
  return 6-pairs+Math.max(0,7-unique);
}

function kokushiShanten(c){
  const terminals=[0,8,9,17,18,26,27,28,29,30,31,32,33];
  let unique=0,pair=0;
  for(const i of terminals){
    if(c[i]>0)unique++;
    if(c[i]>=2)pair=1;
  }
  return 13-unique-pair;
}

function calculateShanten(hand){
  if(isWinningHand(hand)) return -1;
  const c=countTiles(hand);
  const key=c.join(',');
  if(SHANTEN_CACHE.has(key)) return SHANTEN_CACHE.get(key);
  const v=Math.min(
    standardShantenFromCounts(c),
    chiitoiShanten(c),
    kokushiShanten(c)
  );
  SHANTEN_CACHE.set(key,v);
  return v;
}

function bestShantenAfterDiscard(hand14){
  if(isWinningHand(hand14)) return -1;
  let best=99;
  for(let i=0;i<hand14.length;i++){
    const h=hand14.slice();
    h.splice(i,1);
    best=Math.min(best,calculateShanten(h));
  }
  return best;
}

function visibleCount(type){
  if(!gameState) return 0;
  let n=0;
  for(const t of gameState.players[0].hand) if(t.type===type)n++;
  for(const p of gameState.players){
    for(const t of p.discards) if(t.type===type)n++;
  }
  for(const di of (gameState.doraIndicators||[gameState.doraIndicator]).filter(Boolean)) if(di.type===type)n++;
  return n;
}

function calculateUkeire(hand13){
  const base=calculateShanten(hand13);
  const results=[];
  const baseCounts=countTiles(hand13);

  for(const type of TILE_TYPES){
    const oi=TILE_ORDER[type];
    if(baseCounts[oi]>=4)continue;

    const fake={id:-1000-oi,type};
    const h14=hand13.concat([fake]);

    // 13枚手に1枚ツモったあと、最善の1枚を切った結果で
    // シャンテン数が改善する牌だけを「受け入れ」とする。
    const next=bestShantenAfterDiscard(h14);

    if(next<base){
      const remain=Math.max(0,4-visibleCount(type));
      if(remain>0)results.push({type,remain,next});
    }
  }

  return {
    shanten:base,
    tiles:results,
    total:results.reduce((s,x)=>s+x.remain,0)
  };
}

// v022 Tile Efficiency Engine 2.0
// 基本思想:
//  1) 向聴戻しを通常候補から分離（normal / receding）
//  2) 同向聴では現在の受け入れを比較
//  3) 1～2シャンテンでは「次に向聴が進んだ後の最大受け入れ」も評価
//  4) 同程度なら形の柔軟性・ドラ保持をタイブレークに使う
// 未来受け入れは Riichi の「現在の受け入れだけでなく、よりテンパイに近い段階の
// 受け入れを重視する」考え方を軽量に実装したもの。

const DISCARD_ANALYSIS_CACHE=new Map();

function handCountKey(hand){
  return countTiles(hand).join(',');
}

function doraKeepBonus(type){
  if(!gameState || !gameState.doraIndicator)return 0;
  const ds=(gameState.doraIndicators||[gameState.doraIndicator]).filter(Boolean).map(x=>nextDoraType(x.type));
  return ds.includes(type) ? -4 : 0;
}

// 手牌の「伸びしろ」を軽く評価する。完成メンツを固定認定せず、
// 連続・対子・複合形を全体として数えるので 34567 のような形も壊れにくい。
function shapeFlexibilityScore(hand13){
  const c=countTiles(hand13);
  let score=0;
  for(let suit=0;suit<3;suit++){
    const off=suit*9;
    for(let n=0;n<9;n++){
      const x=c[off+n];
      if(!x)continue;
      if(x>=2)score += 5;                 // 対子以上
      if(x>=3)score += 9;                 // 刻子
      if(n<=6 && c[off+n+1] && c[off+n+2]) score += 12; // 順子
      if(n<=7 && c[off+n+1]) score += (n>=1 && n<=6 ? 4 : 3); // 隣接
      if(n<=6 && c[off+n+2]) score += 2;  // 嵌張
      // 中張牌の孤立牌は端牌より将来の接続が多い
      if(x===1){
        const near=(n>0?c[off+n-1]:0)+(n<8?c[off+n+1]:0)+(n>1?c[off+n-2]:0)+(n<7?c[off+n+2]:0);
        if(!near)score += [0,1,2,3,4,3,2,1,0][n];
      }
    }
  }
  for(let i=27;i<34;i++){
    if(c[i]>=2)score += 5;
    if(c[i]>=3)score += 9;
  }
  return score;
}

function analyzeDiscardChoicesBase(hand14,withUkeire=false){
  const out=[];
  const seen=new Set();
  for(let i=0;i<hand14.length;i++){
    const type=hand14[i].type;
    if(seen.has(type))continue;
    seen.add(type);
    const h=hand14.slice();
    h.splice(i,1);
    out.push({
      index:i,type,
      shanten:calculateShanten(h),
      ukeire:0,ukeireKinds:0,tiles:[],
      futureUkeire:0,shape:shapeFlexibilityScore(h),
      valueBonus:doraKeepBonus(type)
    });
  }
  out.sort((a,b)=>a.shanten-b.shanten);
  if(withUkeire && out.length){
    const bestShanten=out[0].shanten;
    for(const x of out){
      if(x.shanten!==bestShanten)continue;
      const h=hand14.slice();
      const idx=h.findIndex(t=>t.type===x.type);
      h.splice(idx,1);
      const u=calculateUkeire(h);
      x.ukeire=u.total;
      x.ukeireKinds=u.tiles.length;
      x.tiles=u.tiles;
    }
  }
  return out;
}

// 改善牌を引いた後、さらに次の段階でどれだけ広い受け入れを残せるか。
// 1～2シャンテンの有力候補だけ計算して、スマホでも重くなりすぎないようにする。
function futureUkeireScore(hand13, ukeireTiles){
  let weighted=0, weight=0;
  for(const u of ukeireTiles){
    if(u.remain<=0)continue;
    const fake={id:-9000-TILE_ORDER[u.type],type:u.type};
    const h14=hand13.concat([fake]);
    const next=analyzeDiscardChoicesBase(h14,true);
    if(!next.length)continue;
    const bestS=next[0].shanten;
    const normal=next.filter(x=>x.shanten===bestS);
    const best=Math.max(0,...normal.map(x=>x.ukeire));
    weighted += best*u.remain;
    weight += u.remain;
  }
  return weight ? weighted/weight : 0;
}

function compareEnhancedDiscard(a,b){
  if(a.shanten!==b.shanten)return a.shanten-b.shanten;

  // 現在の受け入れが大差なら素直に広い方。
  const ud=b.ukeire-a.ukeire;
  if(Math.abs(ud)>=5)return ud;

  // 近い候補では、テンパイに近づいた後の広さをより重視。
  if(Math.abs(b.futureUkeire-a.futureUkeire)>0.75)
    return b.futureUkeire-a.futureUkeire;

  if(a.ukeire!==b.ukeire)return b.ukeire-a.ukeire;
  if(a.ukeireKinds!==b.ukeireKinds)return b.ukeireKinds-a.ukeireKinds;
  if(a.shape!==b.shape)return b.shape-a.shape;
  if(a.valueBonus!==b.valueBonus)return b.valueBonus-a.valueBonus;
  return TILE_ORDER[a.type]-TILE_ORDER[b.type];
}

function analyzeDiscardChoices(hand14,withUkeire=false){
  if(!withUkeire)return analyzeDiscardChoicesBase(hand14,false);

  // visible 情報も候補順位に影響するため、現在の河とドラ表示をキーに含める。
  const vis=gameState ? gameState.players.map(p=>p.discards.map(t=>t.type).join('.')).join('|') : '';
  const dk=gameState ? (gameState.doraIndicators||[gameState.doraIndicator]).filter(Boolean).map(x=>x.type).join('.') : '-';
  const key=handCountKey(hand14)+'#'+vis+'#'+dk;
  if(DISCARD_ANALYSIS_CACHE.has(key))return DISCARD_ANALYSIS_CACHE.get(key).map(x=>({...x,tiles:x.tiles.slice()}));

  const out=analyzeDiscardChoicesBase(hand14,true);
  if(!out.length)return out;
  const bestShanten=Math.min(...out.map(x=>x.shanten));
  const normals=out.filter(x=>x.shanten===bestShanten);
  const maxUkeire=Math.max(0,...normals.map(x=>x.ukeire));

  // 未来評価は 1～2シャンテンかつ現在受け入れが上位4枚差以内の候補だけ。
  if(bestShanten>=0 && bestShanten<=2){
    for(const x of normals){
      if(x.ukeire < maxUkeire-4)continue;
      const h=hand14.slice();
      const idx=h.findIndex(t=>t.type===x.type);
      h.splice(idx,1);
      x.futureUkeire=futureUkeireScore(h,x.tiles);
    }
  }

  // 向聴戻しは必ず後ろ。通常候補の中で v022 比較を行う。
  out.sort(compareEnhancedDiscard);
  DISCARD_ANALYSIS_CACHE.set(key,out.map(x=>({...x,tiles:x.tiles.slice()})));
  return out;
}

// v024 hotfix: リーチ可否は牌効率用シャンテン値ではなく、
// 「その牌を切った13枚形に実際の和了牌が1種以上あるか」で直接判定する。
// これにより複合形などでシャンテン計算が取りこぼしてもリーチ表示を失わない。
function getRiichiDiscardTypes(hand14){
  if(!hand14 || hand14.length!==14) return [];
  const out=[];
  const seen=new Set();
  for(let i=0;i<hand14.length;i++){
    const type=hand14[i].type;
    if(seen.has(type))continue;
    seen.add(type);
    const h13=hand14.slice();
    h13.splice(i,1);
    if(getStructuralWaitTypes(h13).length>0) out.push(type);
  }
  return out;
}

function nextDoraType(ind){
  if(ind.endsWith('m') || ind.endsWith('p') || ind.endsWith('s')){
    const n=Number(ind[0]);
    return `${n===9?1:n+1}${ind[1]}`;
  }
  if(ind==='E')return'S';
  if(ind==='S')return'W';
  if(ind==='W')return'N';
  if(ind==='N')return'E';
  if(ind==='P')return'F';
  if(ind==='F')return'C';
  if(ind==='C')return'P';
  return ind;
}

function countDora(hand){
  if(!gameState || !gameState.doraIndicator)return 0;
  const inds=(gameState.doraIndicators||[gameState.doraIndicator]).filter(Boolean);
  let n=0;
  for(const ind of inds){
    const dora=nextDoraType(ind.type);
    n += hand.filter(t=>t.type===dora).length;
  }
  return n;
}

function revealKanDora(){
  if(!gameState || !gameState.deadWall || gameState.deadWall.length<2)return null;
  const inds=gameState.doraIndicators||(gameState.doraIndicators=[gameState.doraIndicator]);
  if(inds.length>=5)return null;
  const idx=Math.min(gameState.deadWall.length-1, 4+inds.length*2);
  const ind=gameState.deadWall[idx];
  if(ind && !inds.some(x=>x.id===ind.id)){ inds.push(ind); logEvent('KAN_DORA',{indicator:ind.type,dora:nextDoraType(ind.type),count:inds.length}); }
  return ind||null;
}

function isTanyao(hand){
  return hand.every(t=>{
    const i=TILE_ORDER[t.type];
    if(i>=27)return false;
    const n=(i%9)+1;
    return n>=2 && n<=8;
  });
}

function getStandardDecompositions(hand){
  if(hand.length!==14)return [];
  const base=countTiles(hand);
  const out=[];
  for(let pair=0;pair<34;pair++){
    if(base[pair]<2)continue;
    const c=base.slice();
    c[pair]-=2;
    const melds=[];
    function dfs(i){
      while(i<34 && c[i]===0)i++;
      if(i===34){out.push({pair,melds:melds.map(x=>({...x}))});return;}
      if(c[i]>=3){
        c[i]-=3; melds.push({kind:'triplet',tile:i}); dfs(i); melds.pop(); c[i]+=3;
      }
      if(i<27 && i%9<=6 && c[i+1]>0 && c[i+2]>0){
        c[i]--;c[i+1]--;c[i+2]--; melds.push({kind:'sequence',start:i}); dfs(i); melds.pop(); c[i]++;c[i+1]++;c[i+2]++;
      }
    }
    dfs(0);
  }
  return out;
}

function isValuePair(pairIndex,playerId){
  const t=TILE_TYPES[pairIndex];
  return t==='P'||t==='F'||t==='C'||t===gameState.roundWind||t===gameState.players[playerId].seatWind;
}

function isRyanmenCompletion(dec,winTileType){
  if(!winTileType)return false;
  const wi=TILE_ORDER[winTileType];
  if(dec.pair===wi)return false;
  for(const m of dec.melds){
    if(m.kind!=='sequence')continue;
    const pos=wi-m.start;
    if(pos===0 && m.start%9!==6)return true;
    if(pos===2 && m.start%9!==0)return true;
  }
  return false;
}

function isPinfuShape(hand,playerId,winTileType){
  return getStandardDecompositions(hand).some(d=>
    d.melds.every(m=>m.kind==='sequence') &&
    !isValuePair(d.pair,playerId) &&
    isRyanmenCompletion(d,winTileType)
  );
}

function sequenceStarts(dec){return dec.melds.filter(m=>m.kind==='sequence').map(m=>m.start);}

function hasIipeikou(dec){
  const a=sequenceStarts(dec);
  return a.some((x,i)=>a.indexOf(x,i+1)>=0);
}
function hasSanshoku(dec){
  const a=new Set(sequenceStarts(dec));
  for(let n=0;n<=6;n++) if(a.has(n)&&a.has(9+n)&&a.has(18+n))return true;
  return false;
}
function hasIttsu(dec){
  const a=new Set(sequenceStarts(dec));
  for(const b of [0,9,18]) if(a.has(b)&&a.has(b+3)&&a.has(b+6))return true;
  return false;
}
function isToitoiDec(dec){return dec.melds.every(m=>m.kind==='triplet');}

function isTerminalHonorIndex(i){return i>=27 || i%9===0 || i%9===8;}
function isChantaDec(dec){
  if(!isTerminalHonorIndex(dec.pair))return false;
  let hasSeq=false, hasHonor=false;
  for(const m of dec.melds){
    if(m.kind==='sequence'){
      hasSeq=true;
      const n=m.start%9;
      if(n!==0 && n!==6)return false;
    }else if(!isTerminalHonorIndex(m.tile))return false;
    if(m.kind==='triplet' && m.tile>=27)hasHonor=true;
  }
  if(dec.pair>=27)hasHonor=true;
  return hasSeq && hasHonor;
}
function isJunchanDec(dec){
  if(dec.pair>=27 || !isTerminalHonorIndex(dec.pair))return false;
  let hasSeq=false;
  for(const m of dec.melds){
    if(m.kind==='sequence'){
      hasSeq=true; const n=m.start%9; if(n!==0 && n!==6)return false;
    }else if(m.tile>=27 || !isTerminalHonorIndex(m.tile))return false;
  }
  return hasSeq;
}
function isHonroutou(hand){return hand.every(t=>isTerminalHonorIndex(TILE_ORDER[t.type]));}
function isShousangenDec(dec){
  const dragons=new Set([31,32,33]);
  const trip=new Set(dec.melds.filter(m=>m.kind==='triplet').map(m=>m.tile));
  return dragons.has(dec.pair) && [...dragons].filter(x=>trip.has(x)).length===2;
}
function kanCount(playerId){return gameState.players[playerId].melds.filter(m=>m.kind==='KAN'||m.kind==='ANKAN'||m.kind==='KAKAN'||(m.tiles||[]).length===4).length;}

function suitComposition(hand){
  const suits=new Set(); let honors=false;
  for(const tile of hand){
    const t=typeof tile==='string' ? tile : tile.type;
    if(t.endsWith('m'))suits.add('m');
    else if(t.endsWith('p'))suits.add('p');
    else if(t.endsWith('s'))suits.add('s');
    else honors=true;
  }
  return {suits,honors};
}

function getStructuralWaitTypes(hand13){
  const waits=[];
  if(hand13.length!==13)return waits;
  const c=countTiles(hand13);
  for(const type of TILE_TYPES){
    const i=TILE_ORDER[type];
    if(c[i]>=4)continue;
    if(isWinningHand(hand13.concat([{id:-9000-i,type}])))waits.push(type);
  }
  return waits;
}

function isFuriten(playerId,baseHand13=null){
  const p=gameState.players[playerId];
  if(!p)return false;
  if(p.riichiFuriten || p.temporaryFuriten)return true;
  // v017: 待ち牌のどれか1種でも自分の河にあれば捨て牌フリテン。
  if(baseHand13 && baseHand13.length===13){
    const waits=new Set(getStructuralWaitTypes(baseHand13));
    if(p.discards.some(t=>waits.has(t.type)))return true;
  }
  return false;
}

function getYaku(hand, ctx){
  const p=gameState.players[ctx.winnerId];
  const c=countTiles(hand);
  const yaku=[];
  const kokushi=isKokushi(c), chiitoi=isSevenPairs(c);
  const decs=(!kokushi&&!chiitoi)?getStandardDecompositions(hand):[];

  if(kokushi) yaku.push({name:'国士無双',han:13});
  else if(chiitoi) yaku.push({name:'七対子',han:2});

  const open=isOpenHand(ctx.winnerId);
  if(p.riichi && !open) yaku.push({name:p.doubleRiichi?'ダブルリーチ':'リーチ',han:p.doubleRiichi?2:1});
  if(p.riichi && p.ippatsuEligible && !open) yaku.push({name:'一発',han:1});
  if(ctx.haitei) yaku.push({name:'海底摸月',han:1});
  if(ctx.houtei) yaku.push({name:'河底撈魚',han:1});
  if(ctx.winType==='tsumo' && !open) yaku.push({name:'門前ツモ',han:1});
  if(isTanyao(hand)) yaku.push({name:'タンヤオ',han:1});

  const yakuhai=[
    ['P','白'],['F','發'],['C','中'],
    [gameState.roundWind,'場風'],
    [p.seatWind,'自風']
  ];
  for(const [type,label] of yakuhai){
    if(c[TILE_ORDER[type]]>=3) yaku.push({name:`役牌 ${label}`,han:1});
  }

  if(!open && isPinfuShape(hand,ctx.winnerId,ctx.winTileType)){
    yaku.push({name:'平和',han:1});
  }

  // v020: 門前の順子系役。
  if(!open && decs.some(hasIipeikou)) yaku.push({name:'一盃口',han:1});
  if(decs.some(hasSanshoku)) yaku.push({name:'三色同順',han:open?1:2});
  if(decs.some(hasIttsu)) yaku.push({name:'一気通貫',han:open?1:2});

  // v021: 染め手・刻子系役。現状は門前専用なので門前翻数。
  const comp=suitComposition(hand);
  if(comp.suits.size===1 && !comp.honors) yaku.push({name:'清一色',han:open?5:6});
  else if(comp.suits.size===1 && comp.honors) yaku.push({name:'混一色',han:open?2:3});
  if(decs.some(isToitoiDec)) yaku.push({name:'対々和',han:2});
  if(decs.some(isJunchanDec)) yaku.push({name:'純全帯幺九',han:open?2:3});
  else if(decs.some(isChantaDec)) yaku.push({name:'混全帯幺九',han:open?1:2});
  if(isHonroutou(hand)) yaku.push({name:'混老頭',han:2});
  if(decs.some(isShousangenDec)) yaku.push({name:'小三元',han:2});
  if(kanCount(ctx.winnerId)>=3) yaku.push({name:'三槓子',han:2});
  if(ctx.rinshan) yaku.push({name:'嶺上開花',han:1});
  if(ctx.chankan) yaku.push({name:'槍槓',han:1});

  // v025: 三暗刻は副露したポン/大明槓を暗刻として数えない。暗槓は暗刻扱い。
  let bestConcealedTriplets=0;
  const fixedTripletTypes=[];
  let concealedKanCount=0;
  for(const m of p.melds){
    if(m.kind==='PON' || m.kind==='KAN' || m.kind==='ANKAN' || m.kind==='KAKAN'){
      fixedTripletTypes.push(TILE_ORDER[m.called || (m.tiles&&m.tiles[0])]);
      if(m.kind==='ANKAN' || m.open===false) concealedKanCount++;
    }
  }
  for(const d of decs){
    const trips=d.melds.filter(m=>m.kind==='triplet').map(m=>m.tile);
    let n=trips.length;
    for(const ft of fixedTripletTypes){
      const idx=trips.indexOf(ft);
      if(idx>=0){ trips.splice(idx,1); n--; }
    }
    n += concealedKanCount;
    if(ctx.winType==='ron' && ctx.winTileType){
      const wi=TILE_ORDER[ctx.winTileType];
      if(trips.includes(wi)) n--;
    }
    bestConcealedTriplets=Math.max(bestConcealedTriplets,n);
  }
  if(bestConcealedTriplets>=3)yaku.push({name:'三暗刻',han:2});

  const baseHan=yaku.reduce((sum,y)=>sum+y.han,0);
  const dora=baseHan>0 ? countDora(hand) : 0;
  if(dora>0)yaku.push({name:`ドラ${dora}`,han:dora,dora:true});
  return yaku;
}

function canWinWithYaku(hand,ctx){
  if(!isWinningHand(hand))return false;
  if(ctx.winType==='ron' && isFuriten(ctx.winnerId,ctx.baseHand13||null))return false;
  return getYaku(hand,ctx).some(y=>!y.dora);
}

function yakuSummary(hand,ctx){
  const y=getYaku(hand,ctx);
  const han=y.reduce((s,x)=>s+x.han,0);
  return {yaku:y,han,text:y.length ? `${y.map(x=>x.name).join('・')} / ${han}翻` : '役なし'};
}

// ============================================================
// Score / East-round helpers (v012)
// ============================================================
function ceil100(n){ return Math.ceil(n/100)*100; }

function meldFu(m){
  if(!m || !m.tiles || !m.tiles.length) return 0;
  if(m.kind!=='PON' && m.kind!=='KAN' && m.kind!=='ANKAN' && m.kind!=='KAKAN') return 0;
  const type=m.called || m.tiles[0];
  const oi=TILE_ORDER[type];
  const terminalHonor=oi>=27 || oi%9===0 || oi%9===8;
  const concealed=(m.kind==='ANKAN' || m.open===false);
  const kan=(m.kind==='KAN' || m.kind==='ANKAN' || m.kind==='KAKAN' || m.tiles.length===4);
  if(kan) return terminalHonor ? (concealed?32:16) : (concealed?16:8);
  return terminalHonor ? (concealed?8:4) : (concealed?4:2);
}

function estimateFu(hand,ctx,yaku){
  // v025: 副露・槓を含む符計算。門前ロン+10符は門前時のみ。
  if(yaku.some(x=>x.name==='七対子'))return 25;
  if(ctx.winType==='tsumo' && yaku.some(x=>x.name==='平和'))return 20;

  const p=gameState.players[ctx.winnerId];
  const open=isOpenHand(ctx.winnerId);
  const decs=getStandardDecompositions(hand);
  if(!decs.length)return 30;
  let best=20;
  const wi=ctx.winTileType ? TILE_ORDER[ctx.winTileType] : -1;
  const fixedTripletTypes=[];
  let fixedFu=0;
  for(const m of p.melds){
    fixedFu += meldFu(m);
    if(m.kind==='PON' || m.kind==='KAN' || m.kind==='ANKAN' || m.kind==='KAKAN'){
      fixedTripletTypes.push(TILE_ORDER[m.called || (m.tiles&&m.tiles[0])]);
    }
  }

  for(const d of decs){
    let f=20 + fixedFu;
    if(ctx.winType==='ron'){
      if(!open) f+=10;
    }else{
      f+=2;
    }
    const pairType=TILE_TYPES[d.pair];
    if(pairType==='P'||pairType==='F'||pairType==='C')f+=2;
    if(pairType===gameState.roundWind)f+=2;
    if(pairType===p.seatWind)f+=2;

    const skip=fixedTripletTypes.slice();
    for(const m of d.melds){
      if(m.kind!=='triplet')continue;
      const si=skip.indexOf(m.tile);
      if(si>=0){ skip.splice(si,1); continue; }
      const terminalHonor=m.tile>=27 || m.tile%9===0 || m.tile%9===8;
      let concealed=true;
      if(ctx.winType==='ron' && wi===m.tile)concealed=false;
      f += terminalHonor ? (concealed?8:4) : (concealed?4:2);
    }

    if(wi>=0){
      if(d.pair===wi)f+=2;
      for(const m of d.melds){
        if(m.kind!=='sequence')continue;
        const pos=wi-m.start;
        if(pos===1)f+=2;
        if(pos===2 && m.start%9===0)f+=2;
        if(pos===0 && m.start%9===6)f+=2;
      }
    }
    let rounded=Math.ceil(f/10)*10;
    // 喰い平和形など、ロン和了の20符形は30符として扱う。
    if(open && ctx.winType==='ron' && rounded===20) rounded=30;
    best=Math.max(best,rounded);
  }
  return best;
}

function scoreLimitName(han,fu){
  if(han>=13)return '役満';
  if(han>=11)return '三倍満';
  if(han>=8)return '倍満';
  if(han>=6)return '跳満';
  if(han>=5 || (han===4 && fu>=40) || (han===3 && fu>=70))return '満貫';
  return '';
}

function basePoints(han,fu){
  if(han>=13)return 8000;
  if(han>=11)return 6000;
  if(han>=8)return 4000;
  if(han>=6)return 3000;
  if(han>=5 || (han===4 && fu>=40) || (han===3 && fu>=70))return 2000;
  return Math.min(2000, fu * Math.pow(2,han+2));
}

function calculatePayment(hand,ctx){
  const s=yakuSummary(hand,ctx);
  const fu=estimateFu(hand,ctx,s.yaku);
  const base=basePoints(s.han,fu);
  const dealer=ctx.winnerId===gameState.dealer;
  const payments={};
  let total=0;

  if(ctx.winType==='ron'){
    const amount=ceil100(base*(dealer?6:4)) + gameState.honba*300;
    payments[ctx.discarderId]=amount;
    total=amount;
  }else{
    for(let pid=0;pid<4;pid++){
      if(pid===ctx.winnerId)continue;
      let amount;
      if(dealer){
        amount=ceil100(base*2);
      }else{
        amount=ceil100(base*(pid===gameState.dealer?2:1));
      }
      amount += gameState.honba*100;
      payments[pid]=amount;
      total+=amount;
    }
  }

  return {
    ...s,fu,base,total,payments,
    limit:scoreLimitName(s.han,fu),
    dealer
  };
}

function applyWinScores(hand,ctx){
  const pay=calculatePayment(hand,ctx);
  for(const [pidStr,amount] of Object.entries(pay.payments)){
    const pid=Number(pidStr);
    gameState.players[pid].score-=amount;
    gameState.players[ctx.winnerId].score+=amount;
  }

  if(gameState.riichiPot>0){
    gameState.players[ctx.winnerId].score+=gameState.riichiPot;
    pay.riichiAward=gameState.riichiPot;
    gameState.riichiPot=0;
  }else{
    pay.riichiAward=0;
  }
  return pay;
}

function rotateSeatWinds(){
  for(let pid=0;pid<4;pid++){
    const rel=(pid-gameState.dealer+4)%4;
    gameState.players[pid].seatWind=['E','S','W','N'][rel];
  }
}

function prepareNextHand(dealerContinues=false){
  if(dealerContinues){
    gameState.honba++;
  }else{
    gameState.honba=0;
    gameState.handNumber++;
    gameState.dealer=(gameState.dealer+1)%4;
  }

  if(gameState.handNumber>4){
    showMatchEnd();
    return false;
  }

  const scores=gameState.players.map(p=>p.score);
  const pot=gameState.riichiPot;
  const dealer=gameState.dealer;
  const handNo=gameState.handNumber;
  const honba=gameState.honba;

  const wall=createWall();
  for(const p of gameState.players){
    p.hand=[];
    p.discards=[];
    p.melds=[];
    p.riichi=false;
    p.riichiStickPaid=false;
    p.riichiTurn=null;
    p.doubleRiichi=false;
    p.ippatsuEligible=false;
    p.temporaryFuriten=false;
    p.riichiFuriten=false;
  }
  rotateSeatWinds();

  for(let r=0;r<13;r++){
    for(let p=0;p<4;p++)gameState.players[p].hand.push(wall.pop());
  }
  gameState.players[dealer].hand.push(wall.pop());
  gameState.players.forEach(p=>sortHand(p.hand));

  const deadWall=wall.splice(0,14);
  gameState.wall=wall;
  gameState.deadWall=deadWall;
  gameState.doraIndicator=deadWall[4];
  gameState.round=`E${handNo}`;
  gameState.roundWind='E';
  gameState.currentPlayer=dealer;
  gameState.turn=0;
  gameState.gameOver=false;
  gameState.result=null;
  gameState.riichiPot=pot;
  gameState.honba=honba;
  gameState.doraIndicators=[gameState.doraIndicator];
  gameState.callsMade=0;

  selectedIndex=null;
  processing=false;
  playerCanTsumo=false;
  playerDrawnTileId=null;
  playerLastDrawType=null;
  riichiPending=false;
  pendingRon=null;

  logEvent('NEXT_HAND',{
    round:gameState.round,dealer,score:scores.slice(),
    honba:gameState.honba,riichiPot:gameState.riichiPot,
    doraIndicator:gameState.doraIndicator.type
  });

  document.getElementById('overlay').classList.remove('show');
  setMessage(`${gameState.round} 開始`);
  render();
  setTimeout(()=>beginCurrentTurn(),250);
  return true;
}

function standingsData(){
  return gameState.players
    .map((p,i)=>({pid:i,name:p.name,score:p.score}))
    .sort((a,b)=>b.score-a.score || a.pid-b.pid);
}

// v016: exhaustive draw / tenpai-noten settlement.
function getExhaustiveDrawTenpai(){
  return gameState.players.map((p,pid)=>({
    pid,
    tenpai:p.hand.length===13 && calculateShanten(p.hand)===0
  }));
}

function applyExhaustiveDrawPayments(){
  const states=getExhaustiveDrawTenpai();
  const tenpai=states.filter(x=>x.tenpai).map(x=>x.pid);
  const noten=states.filter(x=>!x.tenpai).map(x=>x.pid);
  const delta=[0,0,0,0];

  // Standard 3000-point noten penalty. No exchange if all four or none are tenpai.
  if(tenpai.length>0 && tenpai.length<4){
    const receive=3000/tenpai.length;
    const pay=3000/noten.length;
    for(const pid of tenpai){
      gameState.players[pid].score+=receive;
      delta[pid]+=receive;
    }
    for(const pid of noten){
      gameState.players[pid].score-=pay;
      delta[pid]-=pay;
    }
  }

  const dealerTenpai=states[gameState.dealer].tenpai;
  const result={tenpai,noten,delta,dealerTenpai};
  logEvent('EXHAUSTIVE_DRAW',result);
  return result;
}

function showMatchEnd(){
  gameState.gameOver=true;
  processing=true;
  const rows=standingsData();
  el.resultTitle.textContent='東風戦 終了';
  el.resultText.textContent=`1位 ${rows[0].name}　${rows[0].score}点`;
  el.scoreBreakdown.innerHTML='最終結果';
  renderStandings();
  const btn=document.getElementById('againBtn');
  btn.textContent='新しい東風戦';
  btn.dataset.mode='newmatch';
  el.overlay.classList.add('show');
}

// ============================================================
// MahjongAI
// ============================================================
// v023 Defense AI -----------------------------------------------------------
// 攻撃評価(v022)の上に、他家リーチ時だけ安全度レイヤーを重ねる。
// 方針: テンパイ=押す / 1シャンテン=牌効率を維持しつつ安全寄り / 2シャンテン以上=かなり降りる。
function riichiOpponents(playerId){
  return gameState.players
    .map((p,pid)=>({p,pid}))
    .filter(x=>x.pid!==playerId && x.p.riichi);
}

function tileNumber(type){
  return (type.endsWith('m')||type.endsWith('p')||type.endsWith('s')) ? Number(type[0]) : null;
}

function tileSuit(type){
  return (type.endsWith('m')||type.endsWith('p')||type.endsWith('s')) ? type[1] : null;
}

function isGenbutsuAgainst(type,opponentId){
  return gameState.players[opponentId].discards.some(t=>t.type===type);
}

function isSujiAgainst(type,opponentId){
  const n=tileNumber(type), suit=tileSuit(type);
  if(n===null)return false;
  const river=new Set(gameState.players[opponentId].discards.map(t=>t.type));
  return (n>=4 && river.has(`${n-3}${suit}`)) ||
         (n<=6 && river.has(`${n+3}${suit}`));
}

function wallSafetyBonus(type){
  const n=tileNumber(type), suit=tileSuit(type);
  if(n===null)return 0;
  let bonus=0;
  // 簡易壁: 隣接牌が4枚見えていれば、その方向の両面・嵌張形成が減る。
  for(const d of [-1,1]){
    const r=n+d;
    if(r>=1 && r<=9 && visibleCount(`${r}${suit}`)>=4)bonus+=12;
  }
  return Math.min(24,bonus);
}

function dangerAgainstRiichi(type,opponentId){
  if(isGenbutsuAgainst(type,opponentId))return 0;

  const oi=TILE_ORDER[type];
  // 基準危険度。数値が小さいほど安全。
  let danger=100;

  if(oi>=27){
    // 字牌は見えている枚数が多いほど安全。3枚見えならかなり安全。
    const seen=visibleCount(type);
    danger=Math.max(12,78-seen*20);
    return danger;
  }

  const n=(oi%9)+1;
  if(n===1 || n===9)danger-=10;
  else if(n===2 || n===8)danger-=4;

  if(isSujiAgainst(type,opponentId))danger-=32;
  danger-=wallSafetyBonus(type);
  return Math.max(8,danger);
}

function defenseInfo(type,playerId){
  const threats=riichiOpponents(playerId);
  if(!threats.length)return {danger:0,label:'NO_RIICHI',genbutsu:false,suji:false,wall:0};

  const per=threats.map(x=>({
    pid:x.pid,
    danger:dangerAgainstRiichi(type,x.pid),
    genbutsu:isGenbutsuAgainst(type,x.pid),
    suji:isSujiAgainst(type,x.pid)
  }));
  // 複数リーチには「一番危険な相手」を基準にする。
  const danger=Math.max(...per.map(x=>x.danger));
  const genbutsu=per.every(x=>x.genbutsu);
  const suji=!genbutsu && per.every(x=>x.genbutsu||x.suji);
  const wall=wallSafetyBonus(type);
  return {danger,label:genbutsu?'GENBUTSU':suji?'SUJI':wall?'WALL':'UNSAFE',genbutsu,suji,wall,per};
}

function chooseDiscard(gameState, playerId){
  const hand=gameState.players[playerId].hand;
  const analysis=analyzePlayerDiscardChoices(playerId);
  if(!analysis.length)return 0;

  const threats=riichiOpponents(playerId);
  let pick=analysis[0];
  let mode='ATTACK';
  let defense=defenseInfo(pick.type,playerId);

  if(threats.length){
    const bestShanten=analysis[0].shanten;
    const enriched=analysis.map((x,rank)=>({...x,rank,defense:defenseInfo(x.type,playerId)}));

    if(bestShanten>=2){
      // ベタ降り寄り。安全度を最優先し、同程度なら牌効率順位を使う。
      mode='FOLD';
      enriched.sort((a,b)=>a.defense.danger-b.defense.danger || a.rank-b.rank);
      pick=enriched[0];
    }else if(bestShanten===1){
      // 向聴戻しは避けつつ、同じ1シャンテン候補の中で安全度を強く見る。
      mode='BALANCE';
      const same=enriched.filter(x=>x.shanten===bestShanten);
      same.sort((a,b)=>a.defense.danger-b.defense.danger || a.rank-b.rank);
      pick=same[0] || enriched[0];
    }else{
      // テンパイは攻撃優先。v022の最善打牌を維持する。
      mode='PUSH';
      pick=enriched[0];
    }
    defense=pick.defense;
  }

  const idx=hand.findIndex(t=>t.type===pick.type);
  logEvent('AI_DECISION',{
    turn:gameState.turn,player:playerId,discard:pick.type,
    shanten:pick.shanten,ukeire:pick.ukeire,futureUkeire:pick.futureUkeire,
    defenseMode:mode,danger:defense.danger,safety:defense.label,
    riichiThreats:threats.map(x=>x.pid),engine:'tile-efficiency-v022+defense-v023'
  });
  return idx>=0?idx:0;
}

function discardDesirability(hand, idx){
  const type=hand[idx].type;
  const counts=countTiles(hand);
  const oi=TILE_ORDER[type];
  const same=counts[oi];
  let score=0;

  // 字牌は孤立していれば捨てやすい
  if(oi>=27){
    score += same===1 ? 90 : same===2 ? 15 : -90;
    return score + Math.random()*2;
  }

  const num=(oi%9)+1;
  const suitStart=oi-(oi%9);

  // 孤立牌判定
  const near1=(num>1 ? counts[oi-1] : 0) + (num<9 ? counts[oi+1] : 0);
  const near2=(num>2 ? counts[oi-2] : 0) + (num<8 ? counts[oi+2] : 0);

  if(same>=3) score-=130;
  else if(same===2) score-=55;
  else score+=20;

  if(near1===0 && near2===0) score+=60;
  else{
    score-=near1*30;
    score-=near2*12;
  }

  if(num===1 || num===9)score+=22;
  else if(num===2 || num===8)score+=8;
  else score-=5;

  // 既に順子を構成していそうな牌は残しやすくする
  const local=(n)=> (n>=1 && n<=9) ? counts[suitStart+n-1] : 0;
  if((local(num-2)&&local(num-1)) || (local(num-1)&&local(num+1)) || (local(num+1)&&local(num+2))) score-=75;

  return score + Math.random()*2;
}

async function runCpuTurn(playerId){
  if(gameState.gameOver)return;

  const player=gameState.players[playerId];
  processing=true;
  render();

  let drawn=null;
  const afterCount=expectedAfterDiscardCount(playerId);
  const readyCount=expectedReadyToDiscardCount(playerId);
  if(player.hand.length===afterCount){
    await sleep(260);
    drawn=drawTile(playerId);
    if(!drawn)return;
    setMessage(`${PLAYER_NAMES[playerId]} がツモ`);
    render();
    await sleep(220);
  }else if(player.hand.length!==readyCount){
    endGame('ERROR',null,`${PLAYER_NAMES[playerId]} の手牌枚数エラー（${player.hand.length}枚）`);
    return;
  }

  const cpuWinHand=expandedHandForPlayer(playerId);
  const cpuTsumoCtx={winnerId:playerId,winType:'tsumo',winTileType:drawn?drawn.type:null,haitei:!!drawn&&gameState.wall.length===0,rinshan:!!pendingRinshan};
  if(canWinWithYaku(cpuWinHand,cpuTsumoCtx)){
    const ctx=cpuTsumoCtx;
    const pay=applyWinScores(cpuWinHand,ctx);
    endGame('WIN',playerId,`${PLAYER_NAMES[playerId]} ツモ`,pay,ctx);
    return;
  }

  let idx;
  let declaringRiichi=false;

  // リーチ後は原則ツモ切り。
  if(player.riichi && drawn){
    idx=player.hand.findIndex(t=>t.id===drawn.id);
  }else{
    const options=isOpenHand(playerId)?[]:getRiichiDiscardTypes(player.hand);
    if(!player.riichi && !isOpenHand(playerId) && player.score>=1000 && options.length){
      // v010 CPUはテンパイしたらリーチ。
      const analyses=analyzePlayerDiscardChoices(playerId).filter(x=>x.shanten===0);
      const best=analyses[0];
      idx=player.hand.findIndex(t=>t.type===best.type);
      declaringRiichi=true;
      setRiichiState(playerId);
      player.score-=1000;
      gameState.riichiPot+=1000;
      logEvent('RIICHI',{turn:gameState.turn,player:playerId,discard:best.type,riichiPot:gameState.riichiPot});
    }else{
      idx=chooseDiscard(gameState,playerId);
    }
  }

  const tile=discardTile(playerId,idx);
  if(declaringRiichi)tile.riichiDiscard=true;
  else if(player.riichi)player.ippatsuEligible=false;

  if(player.hand.length!==afterCount){
    endGame('ERROR',null,`${PLAYER_NAMES[playerId]} の打牌後手牌エラー（${player.hand.length}枚 / 期待${afterCount}枚）`);
    return;
  }

  playSE('cpuDiscard');
  setMessage(`${PLAYER_NAMES[playerId]} が ${declaringRiichi?'リーチ！ ':' '}${tile.type} を打牌`);
  render();
  await sleep(260);

  const stopped=await checkRonAfterDiscard(playerId,tile);
  if(stopped)return;
  const called=await checkCallsAfterDiscard(playerId,tile);
  if(called)return;
  if(checkAbortAfterDiscard())return;

  nextPlayer();
  processing=false;
  await beginCurrentTurn();
}

async function beginCurrentTurn(){
  if(gameState.gameOver || pendingRon || pendingCall)return;

  const p=gameState.currentPlayer;
  const player=gameState.players[p];
  selectedIndex=null;
  playerCanTsumo=false;
  riichiPending=false;
  pendingRon=null;
  render();

  if(p!==0){
    await runCpuTurn(p);
    return;
  }

  processing=true;
  let drawn=(pendingRinshan && pendingRinshan.playerId===0)?{id:pendingRinshan.id,type:pendingRinshan.type}:null;
  if(drawn)pendingRinshan=null;

  const afterCount=expectedAfterDiscardCount(0);
  const readyCount=expectedReadyToDiscardCount(0);
  if(player.hand.length===afterCount){
    await sleep(180);
    drawn=drawTile(0);
    if(!drawn)return;
    setMessage(`ツモ：${drawn.type}`);
    render();
    await arrangePlayerHandAfterDraw();
  }else if(player.hand.length!==readyCount){
    endGame('ERROR',null,`PLAYERの手牌枚数エラー（${player.hand.length}枚 / 期待${afterCount}または${readyCount}枚）`);
    return;
  }

  const humanWinHand=expandedHandForPlayer(0);
  const humanTsumoCtx={winnerId:0,winType:'tsumo',winTileType:drawn?drawn.type:null,haitei:!!drawn&&gameState.wall.length===0,rinshan:!!pendingRinshan};
  if(canWinWithYaku(humanWinHand,humanTsumoCtx)){
    playerCanTsumo=true;
    processing=false;
    const s=yakuSummary(humanWinHand,humanTsumoCtx);
    setMessage(`ツモできます：${s.text}`);
    render();
    return;
  }

  // リーチ後はツモ牌を確認後、自動でツモ切り。
  if(player.riichi && drawn){
    processing=false;
    setMessage('リーチ中：ツモ切りします');
    render();
    await sleep(500);
    const idx=player.hand.findIndex(t=>t.id===drawn.id);
    if(idx>=0){
      selectedIndex=idx;
      playerDiscard(idx,true);
    }
    return;
  }

  processing=false;
  setMessage('あなたの手番です。捨てる牌を選んでください');
  render();
}

async function checkRonAfterDiscard(discarderId,tile){
  const candidates=[];
  for(let off=1;off<=3;off++){
    const pid=(discarderId+off)%4;
    const base=expandedHandForPlayer(pid);
    const h=base.concat([{id:tile.id,type:tile.type}]);
    if(canWinWithYaku(h,{winnerId:pid,winType:'ron',discarderId,winTileType:tile.type,baseHand13:base,houtei:gameState.wall.length===0})){
      candidates.push({pid,hand:h});
    }
  }

  if(!candidates.length)return false;

  const human=candidates.find(x=>x.pid===0);
  const cpu=candidates.filter(x=>x.pid!==0);

  if(human){
    pendingRon={discarderId,tile,cpuCandidates:cpu,humanHand:human.hand};
    processing=false;
    const s=yakuSummary(human.hand,{winnerId:0,winType:'ron',discarderId,winTileType:tile.type,baseHand13:expandedHandForPlayer(0),houtei:gameState.wall.length===0});
    setMessage(`ロンできます：${s.text}`);
    render();
    return true;
  }

  const winner=cpu[0];
  if(winner){
    const ctx={winnerId:winner.pid,winType:'ron',discarderId,winTileType:tile.type,houtei:gameState.wall.length===0};
    const pay=applyWinScores(winner.hand,ctx);
    endGame('WIN',winner.pid,`${PLAYER_NAMES[winner.pid]} ロン（${PLAYER_NAMES[discarderId]}から）`,pay,ctx);
    return true;
  }
  return false;
}

async function continueAfterRonWindow(){
  const d=pendingRon ? pendingRon.discarderId : gameState.currentPlayer;
  pendingRon=null;
  processing=true;
  render();
  await sleep(100);
  // currentPlayerは捨てた人のままなので次へ進める。
  gameState.currentPlayer=d;
  nextPlayer();
  processing=false;
  await beginCurrentTurn();
}

function validatePlayerDiscardState(){
  const n=gameState.players[0].hand.length;
  const expected=expectedReadyToDiscardCount(0);
  if(n!==expected){
    setMessage(`手牌エラー：打牌時は${expected}枚必要です（現在${n}枚）`);
    return false;
  }
  return true;
}

function playerDiscard(index,force=false){
  if(!gameState || gameState.gameOver || pendingRon || pendingCall || processing || gameState.currentPlayer!==0)return;
  if(!validatePlayerDiscardState())return;

  const hand=gameState.players[0].hand;
  const chosen=hand[index];
  if(!chosen)return;

  if(riichiPending){
    const legal=getRiichiDiscardTypes(hand);
    if(!legal.includes(chosen.type)){
      setMessage('その牌ではテンパイになりません。リーチ可能な牌を選んでください');
      return;
    }
  }

  if(!force && selectedIndex!==index){
    selectedIndex=index;
    playSE('select');
    renderHand();
    return;
  }

  processing=true;
  selectedIndex=null;
  playerCanTsumo=false;
  playerDrawnTileId=null;
  playerLastDrawType=null;

  const declaringRiichi=riichiPending;
  riichiPending=false;

  const tile=discardTile(0,index);
  if(!tile){processing=false;return;}

  if(declaringRiichi){
    setRiichiState(0);
    gameState.players[0].score-=1000;
    gameState.riichiPot+=1000;
    tile.riichiDiscard=true;
    logEvent('RIICHI',{turn:gameState.turn,player:0,discard:tile.type});
  }

  if(!declaringRiichi && gameState.players[0].riichi)gameState.players[0].ippatsuEligible=false;

  const expectedAfter=expectedAfterDiscardCount(0);
  if(gameState.players[0].hand.length!==expectedAfter){
    endGame('ERROR',null,`PLAYERの打牌後手牌エラー（${gameState.players[0].hand.length}枚 / 期待${expectedAfter}枚）`);
    return;
  }

  playSE('discard');
  setMessage(`あなたは ${declaringRiichi?'リーチ！ ':''}${tile.type} を打牌`);
  render();

  setTimeout(async()=>{
    const stopped=await checkRonAfterDiscard(0,tile);
    if(stopped)return;
    const called=await checkCallsAfterDiscard(0,tile);
    if(called)return;
    if(checkAbortAfterDiscard())return;
    nextPlayer();
    processing=false;
    await beginCurrentTurn();
  },220);
}
