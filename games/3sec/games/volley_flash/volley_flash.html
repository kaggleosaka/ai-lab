<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a29"><title>閃光レシーブ | VOLLEY FLASH</title><style>
*{box-sizing:border-box}body{margin:0;background:#07131e;color:#fff;font-family:system-ui,'Yu Gothic',sans-serif;overscroll-behavior:none}main{max-width:520px;margin:auto;padding:18px 16px max(16px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.eyebrow{font-size:10px;letter-spacing:3px;color:#8eabb9}h1{font-size:25px;margin:3px 0;letter-spacing:2px}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}#sound{background:transparent;border:1px solid #39515e;border-radius:20px;padding:9px;font-size:12px}.stats{display:flex;justify-content:space-between;border-top:1px solid #28404d;padding:12px 2px;font-size:12px;color:#a4bdc7}.stats b{font-size:21px;color:#fff;margin-left:6px}.arena{position:relative;border:1px solid #36515b;border-radius:16px;overflow:hidden;background:#112b3a;box-shadow:0 18px 65px #0006}canvas{display:block;width:100%;height:auto;aspect-ratio:460/470}#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#06152266,#061522ec);padding:24px}#cover h2{font-size:40px;font-style:italic;line-height:1.1;margin:15px 0}#cover p{color:#c8dae2;font-size:13px;line-height:1.9}#cover strong{color:#b7ff54}#start{background:#bbff55;color:#14231c;border:0;border-radius:40px;padding:16px 35px;font-weight:900;margin-top:12px}#message{min-height:28px;text-align:center;font-size:14px;font-weight:700;margin:15px 0 14px;color:#bbff55}.controls{display:flex;gap:12px}.receive{flex:1;min-width:0;width:100%;border:0;border-radius:15px;background:#bdff55;color:#122515;font-weight:900;font-size:20px;padding:18px 8px;box-shadow:0 5px 0 #659431;letter-spacing:1px;-webkit-tap-highlight-color:transparent}.receive:active{transform:translateY(3px);box-shadow:0 2px 0 #659431}.receive:disabled{opacity:.55}footer{text-align:center;color:#7795a4;font-size:11px;margin-top:16px;line-height:1.8}#announcement{position:absolute;left:-10000px}@media(max-height:760px){main{padding-top:10px}canvas{aspect-ratio:460/415;height: min(48vh,470px)}h1{font-size:22px}.stats{padding:8px 2px}#message{margin-top:10px}.receive{padding:14px}}
.header-actions{display:flex;align-items:center;gap:8px}.menu-link{display:inline-block;color:#fff;text-decoration:none;border:1px solid #39515e;border-radius:20px;padding:10px 12px;font-size:12px;touch-action:manipulation}.menu-link:focus-visible{outline:2px solid #bdff55;outline-offset:3px}@media(max-width:390px){h1{font-size:19px}.header-actions{gap:5px}.menu-link{padding:10px 8px}}
</style></head><body><main><header><div><div class="eyebrow">ONE TAP VOLLEYBALL</div><h1>閃光レシーブ<span style="color:#bdff55"> /</span></h1></div><nav class="header-actions" aria-label="ゲームメニュー"><a class="menu-link" href="../index.html#casual">MENU</a><button id="sound" aria-label="効果音切替">音 OFF</button></nav></header><div class="stats"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span id="life" aria-label="残り3回">● ● ●</span></div><div class="arena"><canvas id="game" width="460" height="470" aria-label="バレーボールコート。下のボタンでレシーブ"></canvas><div id="cover"><div><div class="eyebrow">FEEL THE PERFECT MOMENT</div><h2>その一瞬を、<br><span style="color:#bdff55">撃ち抜け。</span></h2><p id="intro">リングが重なる瞬間、来た側のボタンをタップ。<br><strong>JUSTで覚醒。必殺ショットが炸裂！</strong><br>左のボールは左、右のボールは右レシーブ！</p><button id="start">ゲームスタート →</button></div></div></div><div id="message">タイミングを合わせて、レシーブ！</div><div class="controls"><button class="receive" id="left" disabled>← 左レシーブ</button><button class="receive" id="right" disabled>右レシーブ →</button></div><footer>リングが重なったら、ボールの来た側をタップ！<br>３回ミスで終了 · PCは ← → キー / A・D でもプレイ</footer><div id="announcement" role="status" aria-live="polite"></div></main><script>
'use strict';
const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d');
let targetX=230,originX=242,playerFromX=230,chosenX=230;
function enableReceive(enabled){$('#left').disabled=$('#right').disabled=!enabled}
let score=0,best=0,lives=3,combo=0,state='idle',phaseStart=0,duration=1900,last=0,now=0,fx='none',sound=false,audio,hiddenAt=0,particles=[];
try{best=Number(localStorage.getItem('volleyFlashDirectionalBest'))||0}catch{} $('#best').textContent=best;
const ui=()=>{$('#score').textContent=score;$('#best').textContent=best;$('#life').textContent='● '.repeat(lives)+'○ '.repeat(3-lives);$('#life').setAttribute('aria-label','残り'+lives+'回')};
function say(t){$('#message').textContent=t;$('#announcement').textContent=t}
function tone(f,length=.12){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f/2,audio.currentTime+length);g.gain.setValueAtTime(.13,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+length);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+length)}catch{}}
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent='音 '+(sound?'ON':'OFF');tone(660)};
function serve(){playerFromX=230;chosenX=230;targetX=Math.random()<.5?110+Math.random()*55:295+Math.random()*55;originX=160+Math.random()*140;state='incoming';phaseStart=performance.now();duration=Math.max(1250,2050-score*1.6);enableReceive(true);say(combo>1?combo+' COMBO！ 次も決めよう':'リングが重なったら、左か右をタップ！')}
function start(){score=0;lives=3;combo=0;particles=[];ui();$('#cover').style.display='none';serve()}
$('#start').onclick=start;
function receive(side){if(state!=='incoming'||document.hidden)return;chosenX=side==='left'?135:325;if(side!==(targetX<230?'left':'right')){miss();say('方向が逆！ ボールの来た側をタップ');return}chosenX=targetX;now=performance.now();const delta=now-phaseStart-duration;const error=Math.abs(delta);if(error<=90){combo++;score+=100+Math.min(combo-1,10)*20;fx='perfect';say('JUST！ 閃光スパイク ⚡ '+combo+' COMBO');tone(1000,.4);if(navigator.vibrate)navigator.vibrate([30,25,50]);}else if(error<=240){score+=30;combo=0;fx='good';say('GOOD！ ナイスレシーブ +30');tone(600)}else{miss();return}state='result';phaseStart=now;enableReceive(false);for(let i=0;i<35;i++)particles.push({x:targetX,y:340,vx:(Math.random()-.5)*12,vy:(Math.random()-.7)*12,life:1});saveBest();ui()}
function saveBest(){if(score>best){best=score;try{localStorage.setItem('volleyFlashDirectionalBest',best)}catch{}}}
function miss(){lives--;combo=0;fx='miss';state='result';phaseStart=performance.now();enableReceive(false);say(lives?'MISS… 次のボールに集中！':'FINISH！ もう一度チャレンジ');tone(150,.3);ui()}
for(const side of ['left','right'])$('#'+side).addEventListener('pointerdown',e=>{e.preventDefault();receive(side)});window.addEventListener('keydown',e=>{if(e.repeat)return;if(['ArrowLeft','ArrowRight','KeyA','KeyD','Space'].includes(e.code)){e.preventDefault();if(state==='idle'||state==='over'){start();return}if(e.code==='ArrowLeft'||e.code==='KeyA')receive('left');if(e.code==='ArrowRight'||e.code==='KeyD')receive('right')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=performance.now();else if(hiddenAt){phaseStart+=performance.now()-hiddenAt;hiddenAt=0}});
function line(x,y,a,b,color='#ffffff66',w=2){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()}
function ball(x,y,r,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ellipse(0,0,r,r,'#fff9d6');ctx.strokeStyle='#214d69';ctx.lineWidth=r*.25;for(let a=0;a<3;a++){ctx.rotate(Math.PI*2/3);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(r*.8,-r*.7,r,0);ctx.stroke()}ellipse(-r*.3,-r*.4,r*.17,r*.1,'#fff');ctx.restore()}
function player(x,y,s,color,attack=false){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,9,27,8,'#0004');line(-8,-22,-17,0,'#d2b09c',10);line(9,-22,20,1,'#d2b09c',10);ctx.fillStyle='#102636';ctx.fillRect(-17,-38,34,18);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-18,-72);ctx.lineTo(15,-72);ctx.lineTo(18,-34);ctx.lineTo(-18,-34);ctx.fill();line(-14,-65,attack?-20:-7,attack?-105:-40,'#e7bc9b',10);line(14,-65,attack?34:5,attack?-120:-40,'#e7bc9b',10);ellipse(0,-87,14,17,'#edc2a1');ctx.fillStyle='#102332';ctx.beginPath();ctx.moveTo(-15,-88);ctx.lineTo(-16,-106);ctx.lineTo(-2,-101);ctx.lineTo(11,-109);ctx.lineTo(15,-86);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 19px sans-serif';ctx.fillText('7',-6,-45);ctx.restore()}
function scene(t){let bg=ctx.createLinearGradient(0,0,0,470);bg.addColorStop(0,'#102c42');bg.addColorStop(.6,'#285569');bg.addColorStop(1,'#143547');ctx.fillStyle=bg;ctx.fillRect(0,0,460,470);ctx.fillStyle='#c4f8ff';for(let i=0;i<6;i++){ctx.globalAlpha=.3;ctx.fillRect(16+i*83,35,47,4)}ctx.globalAlpha=1;for(let i=0;i<65;i++){ellipse((i*71)%460,70+(i*31)%58,2,3,i%2?'#3f7386':'#528792')}
ctx.fillStyle='#ae7052';ctx.beginPath();ctx.moveTo(112,146);ctx.lineTo(348,146);ctx.lineTo(493,470);ctx.lineTo(-33,470);ctx.fill();ctx.fillStyle='#c48a62';ctx.beginPath();ctx.moveTo(90,224);ctx.lineTo(370,224);ctx.lineTo(490,470);ctx.lineTo(-30,470);ctx.fill();line(112,146,-33,470,'#f4dac2',3);line(348,146,493,470,'#f4dac2',3);line(90,224,370,224,'#ffe3c8',3);line(56,314,404,314,'#ffe3c8',3);line(230,146,230,470,'#ffffff24',1);
player(originX,190,.52,'#ff7672',true);line(65,170,65,291,'#a4c4ce',5);line(395,170,395,291,'#a4c4ce',5);for(let y=175;y<243;y+=10)line(65,y,395,y,'#dbf0fa66',1);for(let x=65;x<=395;x+=15)line(x,175,x,242,'#dbf0fa55',1);line(65,175,395,175,'#fff',4);
let p=state==='incoming'?(t-phaseStart)/duration:0;ctx.strokeStyle='#bdff55';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(targetX,382,36,12,0,0,7);ctx.stroke();player(state==='incoming'?230:chosenX,405,1.04,'#67e0cf');if(state==='incoming'){let y=115+Math.min(p,1.25)*245,x=originX+(targetX-originX)*Math.min(p,1.25);ellipse(x,382,12+8*p,4,'#0003');for(let i=4;i>=1;i--){ctx.globalAlpha=.12;ball(x+i*2,y-i*16,10+p*7,p*8)}ctx.globalAlpha=1;ball(x,y,10+p*7,p*8);ctx.strokeStyle=p>.88?'#bdff55':'#ffffff70';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(targetX,382,36+(1-p)*130,12+(1-p)*43,0,0,7);ctx.stroke()}
if(state==='result'){let q=(t-phaseStart)/1000;if(fx==='good'){ball(targetX+(230-targetX)*q,330-180*q+60*q*q,17,q*5)}if(fx==='miss'){ball(targetX+(targetX<230?-80:80)*q,390+100*q,17,q)}if(fx==='perfect'){if(q<.9)cutin(q);else{ctx.fillStyle='#a4ffff22';ctx.fillRect(0,0,460,470);line(235,290,310,160,'#bdff55',15);ball(235+75*Math.min(1,(q-.9)*3),290-130*Math.min(1,(q-.9)*3),20,q*12);label('THUNDER SPIKE',230,100,27,'#bdff55')}}}
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.02;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#bdff55';ctx.fillRect(p.x,p.y,4,7)}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);
}
function label(s,x,y,size,col){ctx.fillStyle=col;ctx.font='900 italic '+size+'px system-ui';ctx.textAlign='center';ctx.fillText(s,x,y);ctx.textAlign='left'}
function cutin(q){ctx.save();ctx.fillStyle='#041625dd';ctx.fillRect(0,0,460,470);ctx.fillStyle='#aaff48';ctx.beginPath();ctx.moveTo(0,125);ctx.lineTo(460,65);ctx.lineTo(460,370);ctx.lineTo(0,430);ctx.fill();ctx.save();ctx.beginPath();ctx.moveTo(0,140);ctx.lineTo(460,80);ctx.lineTo(460,350);ctx.lineTo(0,410);ctx.clip();ctx.fillStyle='#0d4957';ctx.fillRect(0,0,460,470);for(let i=0;i<28;i++){let y=(i*47+q*600)%470;line(0,y,460,y-70,i%3?'#58c6b455':'#d6ffab',i%3?2:5)}player(262,450,3.2,'#67e0cf',true);ball(370,130,39,q);ctx.restore();label('JUST RECEIVE',205,123,31,'#fff');ctx.shadowColor='#032c28';ctx.shadowBlur=12;label('閃 光 一 撃',230,353,49,'#fff');label('PERFECT  × '+combo,230,398,21,'#bdff55');ctx.restore()}
function frame(t){if(!document.hidden){now=t;if(state==='incoming'&&t-phaseStart>duration+250)miss();if(state==='result'&&t-phaseStart>(fx==='perfect'?1850:850)){if(lives<=0){state='over';$('#cover').style.display='flex';$('#cover h2').innerHTML='NICE GAME!<br><span style="color:#bdff55">'+score+' pts</span>';$('#intro').textContent='ベスト '+best+'点。次はもっとJUSTを決めよう！';$('#start').textContent='もう一度プレイ →'}else serve()}scene(t)}last=t;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
